# 场景评测里 forbid_patterns 命中的人工复核结论，持久化存档（CR-061）。
#
# 背景：CR-054~060 六轮想在正则层面自动判断"forbid_patterns 命中是否
# 真的构成问题"，每次都被找到新反例；CR-060 决定放弃自动定性，命中一律
# 记入 `forbidden_hit`，标记"待人工复核"。但 CR-061 指出，光标记不够——
# 报告里没有承载"人到底看没看、看完的结论是什么"，命中 forbidden 的题
# 还是会直接算进"通过"，等于换了个说法重新引入 CR-053 想堵住的洞
# （已知的可疑断言被悄悄计入统计）。
#
# 因此 `run_scenarios.py` 现在要求：一道题只要命中了 forbid_patterns，
# 就必须在这份文件里找到一条对应记录、且 `verdict: confirmed_ok`，才能
# 计入"通过"；找不到记录，或记录写的是 `confirmed_issue`，这道题一律记
# `review_required`——不计入通过数，也不能让整次评测的退出码为 0。
#
# 每条记录：
#   question   逐字匹配 `scenario_questions.yaml` 里对应题目的 `q` 字段
#   pattern    逐字匹配触发的那条 `forbid_patterns` 正则字符串
#   verdict    confirmed_ok    — 人工看过具体输出，确认这次命中不是真实
#                                 问题（比如答案其实明确否定了排他性主张），
#                                 可以计入通过
#            | confirmed_issue — 人工看过，确认这确实是一个真实问题（比如
#                                 本地兜底模型的合成质量缺陷），但当前轮次
#                                 不修复（模型/提示词能力问题，不是卡片或
#                                 判据本身的错误）——继续记 review_required，
#                                 不能靠"反正标记过了"就当作已解决
#   note       复核依据，不能空——写清楚看了哪次输出、判断理由
#   reviewed_at 复核日期（ISO 8601）
#
# 同一道题换一次模型/提示词/卡片版本后，如果 forbid_patterns 命中的
# 具体措辞变了，应该重新复核而不是延用旧记录——这份文件按 (question,
# pattern) 这个组合键匹配，不看具体生成文本，因此**不会自动失效**：
# 如果复核结论已经不适用了（比如卡片改写后不该再命中这条 pattern），
# 需要人工发现并更新/删除这条记录，本文件本身不做这层校验。

reviews:
  - question: "spring-data-redis 的 RedisAtomicLong 这类原子计数器，如果只调用它的无条件递增/递减操作来做库存扣减，能不能防止超卖"
    pattern: "(?i)((必须|只能|需要?|唯一(的)?(方法|方式|办法)|only way|must|need).{0,10}(Lua|脚本|script))"
    verdict: confirmed_issue
    note: >
      逐句核对 bench/reports/eval-scenarios-20260907T190800Z.json 第 18
      题真实输出："需使用 Lua 脚本实现读取当前库存、判断是否足够、再执行
      扣减的原子操作"——这句话紧跟在"缺乏读-改-写之间的状态检查，无法
      判断库存是否充足"之后，语境上是把 Lua 脚本讲成解决这个问题的
      必要步骤，没有像收窄后的卡片正文那样提及"或本文档未覆盖的其它
      机制"这个限定。判定为本地兜底后端（Qwen 3-4B）的合成质量问题——
      同一类"补充卡片原文没有的绝对化措辞"此前在第 3/4 题也出现过（见
      scenario_questions.yaml 里 CR-053 章节的记录）——不是卡片内容或
      forbid_patterns 判据本身的错误，因此不确认为 confirmed_ok，继续
      记 review_required。是否需要收紧问法或等云端验证后再复核，留给
      T-011 云端校准任务处理。
    reviewed_at: "2026-09-07"
