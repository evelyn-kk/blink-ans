# 场景评测里 forbid_patterns 命中的人工复核结论，持久化存档（CR-061，
# CR-062/063 修正）。
#
# 背景：CR-054~060 六轮想在正则层面自动判断"forbid_patterns 命中是否
# 真的构成问题"，每次都被找到新反例；CR-060 决定放弃自动定性，命中一律
# 记入 `forbidden_hit`，标记"待人工复核"。CR-061 指出光标记不够——报告
# 里没有承载"人到底看没看、看完的结论是什么"，命中 forbidden 的题还是
# 会直接算进"通过"，等于换了个说法重新引入 CR-053 想堵住的洞。
#
# 因此 `run_scenarios.py` 要求：一道题只要命中了 forbid_patterns，就
# 必须在这份文件里找到一条**同时**匹配 question、pattern、answer_hash
# 三者的记录，才能不停在 review_required：
#   - verdict: confirmed_ok    → 判 passed
#   - verdict: confirmed_issue → 判 failed（CR-062：这是已完成的人工
#     判断"我看过，这确实是问题"，不是"还没人看"，不该和 review_required
#     混为一谈）
#   - 没有匹配记录（question/pattern 对得上，answer_hash 对不上，或者
#     压根没记录）→ 判 review_required，不计入通过数，也不能让整次
#     评测的退出码为 0
#
# 每条记录：
#   question    逐字匹配 `scenario_questions.yaml` 里对应题目的 `q` 字段
#   pattern     逐字匹配触发的那条 `forbid_patterns` 正则字符串
#   answer_hash `run_scenarios.py` 里 `_answer_hash()` 对本次
#               `answer_text` 算出的 SHA-256 前 16 位十六进制——
#               **必须**是人工实际读过、据此下判断的那次具体回答的
#               哈希，不是随手编的占位符（CR-063：本地模型每次生成的
#               措辞会变，同一个 pattern 这次命中的可能是一句正确的
#               否定表述，下次命中的可能是一句真实的排他性断言，一条
#               复核结论不能不看内容就放行未来所有命中——绑定具体
#               回答后，模型换一次说法，旧记录自动失效，必须重新复核
#               这次新出现的内容，不会有"一次确认、永久生效"的豁免）
#   verdict     confirmed_ok    — 人工看过这个具体 answer_hash 对应的
#                                 输出，确认这次命中不是真实问题（比如
#                                 答案其实明确否定了排他性主张）
#             | confirmed_issue — 人工看过，确认这确实是一个真实问题
#                                 （比如本地兜底模型的合成质量缺陷），
#                                 但当前轮次不修复（模型/提示词能力
#                                 问题，不是卡片或判据本身的错误）——
#                                 判 failed，如实反映"已确认有问题"，
#                                 不能靠"反正标记过了"就当作已解决
#   note        复核依据，不能空——写清楚看了哪次输出、判断理由
#   reviewed_at 复核日期（ISO 8601）

reviews:
  - question: "spring-data-redis 的 RedisAtomicLong 这类原子计数器，如果只调用它的无条件递增/递减操作来做库存扣减，能不能防止超卖"
    pattern: "(?i)((必须|只能|需要?|唯一(的)?(方法|方式|办法)|only way|must|need).{0,10}(Lua|脚本|script))"
    answer_hash: "f49228a3a511314e"
    verdict: confirmed_issue
    note: >
      逐句核对 bench/reports/eval-scenarios-20260907T190800Z.json 第 18
      题真实输出（answer_hash 对应的正是这次输出）："需使用 Lua 脚本
      实现读取当前库存、判断是否足够、再执行扣减的原子操作"——这句话
      紧跟在"缺乏读-改-写之间的状态检查，无法判断库存是否充足"之后，
      语境上是把 Lua 脚本讲成解决这个问题的必要步骤，没有像收窄后的
      卡片正文那样提及"或本文档未覆盖的其它机制"这个限定。判定为本地
      兜底后端（Qwen 3-4B）的合成质量问题——同一类"补充卡片原文没有的
      绝对化措辞"此前在第 3/4 题也出现过（见 scenario_questions.yaml
      里 CR-053 章节的记录）——不是卡片内容或 forbid_patterns 判据
      本身的错误，因此不确认为 confirmed_ok；按 CR-062 的修正，
      confirmed_issue 现在直接判 failed（不再是 review_required），
      如实反映"已经看过、确认是本地模型的已知限制"这个终态。是否需要
      收紧问法或等云端验证后再复核，留给 T-011 云端校准任务处理——一旦
      模型/提示词/卡片改变导致真实生成内容变化，这条记录会因
      answer_hash 不匹配而自动失效，届时需要针对新的输出重新复核，不
      会延用这条旧结论。
    reviewed_at: "2026-09-07"

  # 2026-09-08（第四张卡片轮次）：同一道题、同一条 pattern 再次命中，但
  # 本地模型这次的措辞与 2026-09-07 那次不同（answer_hash 因此不同，旧记录
  # 按 CR-063 的设计自动失效），所以重新逐句复核了这次的真实输出。
  - question: "spring-data-redis 的 RedisAtomicLong 这类原子计数器，如果只调用它的无条件递增/递减操作来做库存扣减，能不能防止超卖"
    pattern: "(?i)((必须|只能|需要?|唯一(的)?(方法|方式|办法)|only way|must|need).{0,10}(Lua|脚本|script))"
    answer_hash: "bf9c02893938fbd5"
    verdict: confirmed_issue
    note: >
      逐句核对 bench/reports/eval-scenarios-20260908T012349Z.json 第 18 题
      的真实输出。触发命中的仍是同一句"需使用 Lua 脚本实现读取当前库存、
      判断是否足够、再执行扣减的原子操作"（与 f49228a3a511314e 那次逐字
      相同）；本次输出与上次的差异只在这句之后的补充部分（上次给的是
      `checkandset.lua` 配置示例，这次是"关键前提/风险"两条），没有出现
      任何把这句排他性措辞否定或限定回去的表述。结论与上次一致：这是
      本地兜底后端（Qwen 3-4B）在卡片正文没有相应断言时自行补上绝对化
      措辞的合成质量问题，不是卡片内容或判据本身的错误，判 confirmed_issue
      （按 CR-062 计为 failed）。
      附带记录一条本轮实测到的结构性事实，供审查方判断：本地后端逐次
      生成并不确定（同一题两次运行的正文可比对差异见上），因此
      answer_hash 绑定意味着**每次重跑都会产生新的哈希、这道题都会重新
      落回 review_required**——这条记录不能让审查方自己那次重跑变绿。
      这是 CR-063"一次确认不得永久豁免"的既定代价，本轮不改判据，只如实
      登记。
    reviewed_at: "2026-09-08"

  # 2026-09-08（处理 CR-066 的同一轮）：新增的 Q20 负向约束第一次命中，
  # 命中的正是 codex R60 用来复现 CR-066 的那句真实输出。
  - question: "想从 pg_stat_statements 里挑出最该优化的语句，按 total_exec_time 排和按 mean_exec_time 排有什么不同"
    pattern: "(?i)(单次|每次|单条|极端|最(慢|坏|大))[^。；\\n]{0,20}total_exec_time"
    answer_hash: "7e7e58a3d52fec43"
    verdict: confirmed_issue
    note: >
      逐句核对 bench/reports/eval-scenarios-20260908T193341Z.json 第 20 题
      的真实输出。命中的是这一句："若关注单次极端延迟，可看
      total_exec_time"。这与卡片和 PostgreSQL 官方文档的字段定义直接冲突：
      `total_exec_time` 是该语句形状**跨全部调用累计**的执行时间，单次
      极端延迟应当看 `max_exec_time`（或按平均看 `mean_exec_time`），
      一个被调用三千次的语句累计耗时高，完全不意味着它单次慢。答案的
      前半句（total 反映总耗时、mean 反映单次平均）是对的，正因为如此
      两条绑定式正向 keypoint 全部命中——这正是 CR-066 指出的漏洞形状：
      事实说对了，最后的选择建议却反了。判 confirmed_issue（按 CR-062
      计为 failed），归因为本地兜底后端（Qwen 3-4B）的合成质量问题，
      不是卡片内容或判据本身的错误。同一次生成的措辞与 R60 那次逐字
      相同，说明这句错误建议在当前模型/提示词下是可复现的，不是偶发。
    reviewed_at: "2026-09-08"
