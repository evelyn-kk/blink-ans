# T-011 场景评测雏形：覆盖 Outbox（knowledge/scenarios/outbox-pattern.md）与
# Kafka 消费者重试/死信队列（knowledge/scenarios/kafka-consumer-retry-dlq.md）
# 两张场景卡片。
#
# 与 basic_questions.yaml 的区别：那份只验证"有没有引用、拒答对不对"，
# 不判断答案的技术正确性。这里的 expect_keypoints 是人工核对过、
# 卡片正文确实包含的具体事实点（正则，大小写不敏感），用来判断
# "答案是否真的说中了关键点"，而不只是"有没有引用"——
# 沿用 ranking_probe.yaml"金标准要人工核对"与 AGENTS.md §5.3
# "判据不得承诺未测量的因果"的方法论：不引入未经验证的 LLM 判分。
#
# expect_sources：答案引用中必须出现的来源项目（全部需出现，不是任一）。
#
# **实测踩坑记录（务必读）**：第一版 keypoints 全部只写了英文短语（照抄卡片
# 原文），用 --offline 本地后端实测后 8 题仅 1 个关键点命中。逐条核对答案原文
# 发现根因不是模型换了种说法这么简单，而是**语言不匹配**——`--language zh`
# 时模型用中文作答，英文概念词只有"本来就该保留原文的标识符"
# （`aggregatetype`/`payload` 这类配置字段名）才会出现在答案里，
# "same transaction"/"write side"/"not exactly once" 这类概念性短语
# 模型会用中文表达（"同一个事务"/"写入侧"/"并非严格一次"）。因此每条概念性
# keypoint 都改成中英文都能命中的模式；标识符类 keypoint 保持英文不变。
# 另外发现第 1 题的问法过于间接（不含"Outbox"/"双写"字样），检索没有召回
# 卡片、答案引用了 PostgreSQL 的 NOTIFY/LISTEN 机制——这是检索侧的真实缺口，
# 不是这道题该测的东西（本轮范围明确排除"不提示关键词也要能召回卡片"这类
# 检索鲁棒性调优，见 wait-for-review.md 自陈），已改写问法使其确实指向本卡片。
#
# **仍未做的验证**：以上校准全部只跑过本地兜底后端（`--offline`，Qwen 3-4B），
# 没有用云端 Claude（生产主力后端）验证过——避免未经用户明确同意产生云端调用
# 费用。本地生成质量明显弱于生产路径，这里的关键点阈值可能对云端答案偏松，
# 需要后续显式授权跑一次云端评测后重新核对。
#
# 规模：本轮只验证框架能跑通 + 一个场景的关键点覆盖率，
# 不是 I3 完整的 100 题评测集（那需要覆盖全部场景卡片，留给后续轮次）。

version: 1

questions:
  - q: "为什么不能直接先写数据库、再单独调用消息队列发通知，而要引入 Outbox 表"
    expect_keypoints:
      # 拆成两条独立关键点而非一条带距离窗口的组合正则——Q7 踩过一次
      # ".{0,60}" 距离估计过短导致真实回答被误判未命中的坑，独立关键点
      # 各自匹配，不依赖对模型会把两个概念隔多远说完的猜测。
      - "(?i)(dual.?writ|双写|两个独立|两次独立)"
      - "(?i)(不一致|不强一致|无强一致性|inconsist)"
    expect_sources: [debezium]

  - q: "Outbox 模式怎么保证数据库写入和消息发布不会不一致"
    expect_keypoints:
      - "(?i)(same transaction|同一个?事务|同一笔事务)"
      - "(?i)(outbox.{0,6}table|outbox\\s*表)"
    expect_sources: [debezium]

  - q: "Debezium 的 Outbox Event Router 是怎么把表里的一行数据变成 Kafka 消息的"
    expect_keypoints:
      - "(?i)aggregatetype"
      - "(?i)payload"
    expect_sources: [debezium]

  - q: "Outbox 表的结构有什么讲究，是不是随便加个字段都行"
    expect_keypoints:
      - "(?i)(insert|队列|queue)"
      - "(?i)(id|aggregatetype|payload)"
    expect_sources: [debezium]

  - q: "用了 Outbox 模式之后，消费者还需要自己处理重复消息吗"
    expect_keypoints:
      - "(?i)(idempoten|幂等)"
      - "(?i)(more than once|not.{0,15}exactly once|重复|不止一次|不是.{0,10}严格一次)"
    expect_sources: [debezium, kafka]

  - q: "Outbox 模式解决的是消息发布的哪一半问题，Kafka 自己的投递保证解决的是另一半吗"
    expect_keypoints:
      - "(?i)(write side|写(入|端)?侧)"
      - "(?i)(read side|读(取|端)?侧|消费(端|侧))"
    expect_sources: [debezium, kafka]

  - q: "如果 Outbox 的转发进程挂了一段时间，业务数据会丢吗"
    expect_keypoints:
      # 同样拆成两条独立关键点（见上面 Q1 的说明）：一条测"结论是不会丢"，
      # 一条测"理由落在已提交/已持久化这个点上"，不假设两者出现的先后顺序
      # 或彼此间隔多远——实测本地后端习惯先给结论再讲原因。
      - "(?i)(不会丢|不丢失|not.{0,10}lost|never.{0,10}lost)"
      - "(?i)(committed|commit|已提交|提交后|持久化|persist|事务)"
    expect_sources: [debezium]

  - q: "Kafka Streams 或事务型生产者能不能让 Outbox 事件端到端只处理一次"
    expect_keypoints:
      - "(?i)(not.{0,20}exactly once|并非.{0,10}(严格)?一次|不是.{0,10}(严格)?一次|不能保证.{0,10}一次)"
      - "(?i)(read side|downstream|consumer|消费(端|者|侧)|下游)"
    expect_sources: [kafka]

  # ---- 第二张场景卡片：Kafka 消费者重试与死信队列 ----
  #
  # 2026-09-06 实测校准记录（务必读；用真实 `run_scenarios.py --offline
  # --language zh` 输出核对过，不是猜的）：
  # 1) 标识符类关键点（`RuntimeException`/`DefaultErrorHandler`/
  #    `@RetryableTopic`/`-dlt`）本地后端稳定保留原文，未出现 Outbox
  #    批次那种"概念性短语被模型翻译成中文"的问题，因此这五题的关键点
  #    大多不需要中英双写；仍在结论性短语上留了双语，理由同上一批。
  # 2) 第 2 题（是否所有异常都应重试）初版直接问"是不是所有异常都应该让
  #    Kafka 消费者重试"，检索命中的是 kafka 来源的 Connect
  #    `errors.tolerance` 内容而不是本卡片——问法不含"Spring Kafka"/
  #    "DefaultErrorHandler"时会被路由到无关的 kafka 语料。改问法显式
  #    带上这两个词后，来源正确回到 spring-kafka；但模型仍把"继承自
  #    `Error` 会绕过错误处理器"和"`DeserializationException` 等是默认
  #    不重试的致命 `RuntimeException`"这两件卡片原文分开的事实混成一句
  #    （错误地说 `DeserializationException` "继承自 Error"），`RuntimeException`
  #    这个词没有出现在答案里——如实记为本地小模型的合成质量问题（与
  #    Outbox 批次已记录的"本地兜底后端会把相邻证据块的事实混淆"同一类），
  #    未松动关键点掩盖它。
  # 3) 第 3 题（死信主题命名+分区数要求）初版问法只问"发到哪个主题"，
  #    模型如实只答了这一件事，第二条关于分区数的关键点必然落空——不是
  #    模型的问题，是问法本身没问那件事。改为把两件事都写进问题
  #    （"...发到哪个主题，对这个死信主题的分区数有什么要求"），因为
  #    这两个事实本就来自同一个卡片小节，合并问法后两条关键点都稳定命中。
  # 实测结果：13 题合计通过 7/13、关键点覆盖率 20/26（77%）；仅本卡片的
  # 5 题里 4/5 通过（第 2 题因上述 (2) 的合成质量问题未通过）。Outbox 原
  # 8 题结果与此前记录完全一致（3/8、11/16），证明新卡片入库未影响其
  # 校准结果。仍未做的验证：与 Outbox 批次相同，只跑过本地兜底后端，
  # 未用云端 Claude 验证过关键点阈值是否对生产路径偏松。

  - q: "Kafka 消费者处理某条消息一直抛异常，Spring Kafka 默认会怎么重试"
    expect_keypoints:
      - "(?i)(backoff|退避|重新投递|redeliver|重试)"
      - "(?i)(同一个?分区|partition|阻塞|block|卡住|hold up)"
    expect_sources: [spring-kafka]

  - q: "在 Spring Kafka 的 DefaultErrorHandler 里，是不是所有异常类型都应该被重试"
    expect_keypoints:
      - "(?i)(RuntimeException)"
      - "(?i)(Error|致命|fatal|不(会|应该)?重试|not.{0,10}retr)"
    expect_sources: [spring-kafka]

  - q: "Spring Kafka 的 DeadLetterPublishingRecoverer 默认把失败消息发到哪个主题，对这个死信主题的分区数有什么要求"
    expect_keypoints:
      - "(?i)(-dlt|dlt\\b)"
      - "(?i)(同一个?分区|partition|分区数|至少)"
    expect_sources: [spring-kafka]

  - q: "用 @RetryableTopic 注解和用 DefaultErrorHandler 在原分区重试，这两种重试方式有什么区别"
    expect_keypoints:
      - "(?i)(@RetryableTopic|独立.{0,6}(主题|topic)|(retry|重试).{0,6}(主题|topic))"
      - "(?i)(不.{0,10}(阻塞|block)|继续.{0,10}(处理|消费)|同一个?(消费者|分区|线程))"
    expect_sources: [spring-kafka]

  - q: "批量消费的 Kafka Listener 能不能用 @RetryableTopic 实现死信队列"
    expect_keypoints:
      - "(?i)(不支持|不能|not.{0,15}support|NOT supported)"
      - "(?i)(DefaultErrorHandler|DeadLetterPublishingRecoverer)"
    expect_sources: [spring-kafka]

  # ---- 第三张场景卡片：Redis 库存超卖 ----
  #
  # 2026-09-07 首次校准记录（`run_scenarios.py --offline --language zh` 输出
  # 逐句核对过，非猜测）：本地兜底后端（Qwen 3-4B）对这五题的回答基本忠实
  # 转述了卡片各小节的实际论点，首次校准即 5/5 全部通过、关键点 10/10 全部
  # 命中。**如实登记一处合成质量问题，不影响关键点判定**：第 3 题（Lua 脚本
  # 实现）答案编造了本卡片原文完全没有的"关键前提：Redis 版本 ≥ 2.6.x，
  # JDK ≥ 17，Spring Framework ≥ 6.0"，第 4 题（SHA1 缓存）编造了"脚本内容
  # 变更需手动更新源码并重新计算 SHA1，否则旧版本脚本将被忽略"——两处都是
  # 本地小模型在真实论点之外添加的无来源细节，与 Outbox/Kafka 批次已记录的
  # "本地兜底合成质量偏弱、会补充或混淆相邻事实"同一类问题，未松动关键点
  # 掩盖它。
  #
  # 2026-09-07 R48 审查产出 CR-051/CR-052（均已处理，详见 `code-review.md`
  # 「处理 CR-051/CR-052」）：第 2 题（Redis 事务）的第二条关键点原先要求
  # 命中"null/看不到/不可见"，这是把卡片当时一处**错误的事实解释**当成了
  # 判据——CR-051 指出 Spring Data Redis 的事务文档明确区分只读命令（走
  # 独立的非事务连接，能读到真实值）与写命令（排队到 `EXEC` 才生效），卡片
  # 原文"事务内读命令一律返回 null"这个说法不成立。卡片已改写为准确版本
  # （读到真实库存值，但写入仍只排队到 EXEC，两次事务之间没有条件提交，
  # 所以照样能各自读到同一库存、各自提交扣减），第二条关键点相应改为测
  # "非原子/竞态/缺少条件提交"这条真实因果，不再测一个已被推翻的错误细节。
  # 第 5 题（RedisAtomicLong）对应的卡片小节原先断言"条件检查只能来自
  # 脚本"，CR-052 指出这比引用的 support-classes 正文断言得更强——真实
  # `RedisAtomicLong` 有 `compareAndSet`/`getAndUpdate` 等 CAS 类 API，
  # 可以用重试式条件更新做到不超卖，不是只有脚本一条路。但语料里实际入库
  # 的 support-classes 页面正文本身并不包含这些 API 细节（只提到"包装
  # key 自增"），因此卡片改写为**收窄声明范围**：只断言"文档描述的这个
  # 包装本身不含阈值检查"，不再断言"只能用脚本"这个语料无法支撑的排他性
  # 结论——没有采纳 codex 建议里把 CAS/`compareAndSet` 写进卡片正文的
  # 具体做法，因为那部分事实在已入库语料里找不到可引用的真实块（Javadoc
  # 未被同步进语料，见 code-review.md 处理记录里的详细理由）。第 5 题
  # 问法本身用的是"直接用来做库存扣减"（即不额外改造），收窄后仍然成立，
  # 关键点未改。
  # 仍未做的验证：与前两批相同，只跑过本地兜底后端，未用云端 Claude 验证过
  # 关键点阈值是否对生产路径偏松。

  - q: "秒杀场景下，先 GET 库存判断是否还有余量，再单独调用 DECR 扣减，为什么会出现超卖"
    expect_keypoints:
      - "(?i)(check.?and.?set|两(个|条|次)?独立|两次.{0,6}(命令|请求|round.?trip)|原子)"
      - "(?i)(超卖|oversell|negative|负数|同时|并发|concurrent)"
    expect_sources: [spring-data-redis]

  - q: "用 Spring 的 @Transactional 把 Redis 的 GET 和 DECR 包在一个事务里，能不能解决库存超卖"
    expect_keypoints:
      - "(?i)(不能|不行|does.{0,10}not|cannot|没有解决)"
      # CR-051 之后：不再测已被推翻的"读命令返回 null"，改测真实因果——
      # 写命令排队到 EXEC 才生效、两次事务之间缺少条件提交，因此仍会竞态。
      - "(?i)(排队|queue|(执行|生效|提交).{0,6}(时|才|后).{0,10}(commit|EXEC|提交)|不.{0,6}(原子|atomic)|竞态|race|并发|同时.{0,10}(读|读到)|各自.{0,10}(提交|扣减))"
    expect_sources: [spring-data-redis]

  - q: "Spring Data Redis 怎么用 Lua 脚本实现库存的原子扣减"
    expect_keypoints:
      - "(?i)(lua|脚本|script)"
      - "(?i)(原子|atomic|一次(性)?|single)"
    expect_sources: [spring-data-redis]

  - q: "每次执行 Redis 的 Lua 脚本都要把脚本内容重新发一遍给服务器吗，会不会很慢"
    expect_keypoints:
      - "(?i)(sha1?|evalsha)"
      - "(?i)(缓存|cache|不需要|不用|无需|only.{0,10}first|falling back)"
    expect_sources: [spring-data-redis]

  # CR-053：这题原先问"能不能直接用 RedisAtomicLong 这类计数器"，措辞较宽，
  # 容易诱导模型对整个类的能力边界下断言（真实一次生成给出"仅支持原子增减，
  # 无法实现读改写完整逻辑"——这本身是越界断言，CR-052 已指出公开 API 还有
  # compareAndSet 等方法，只是这些细节不在已入库语料里）。收窄问法，明确问
  # "调用无条件的递增/递减操作"这一件已入库卡片确实支持的具体事实，减少
  # 诱导模型对整个类下过强结论的空间；同时新增 forbid_patterns 作为兜底——
  # 就算问法收窄后模型仍然给出同类越界断言，也不能因为两条正向 keypoint
  # 凑巧命中就判通过。
  - q: "spring-data-redis 的 RedisAtomicLong 这类原子计数器，如果只调用它的无条件递增/递减操作来做库存扣减，能不能防止超卖"
    expect_keypoints:
      - "(?i)(不能|不行|不足以|does.{0,10}not|cannot)"
      # 放宽"没有"为"没有|无法|不能/不会"，覆盖"无法判断库存是否充足"这类
      # 同义表述——这是校准发现的正则过窄问题，不是放宽判据标准本身。
      - "(?i)(单个?命令|single command|(没有|无法|不(能|会)).{0,8}(条件|判断|检查|阈值)|no.{0,10}(condition|check))"
    forbid_patterns:
      # CR-053 指出的具体越界断言：整个类"仅支持原子增减"（否定 CAS/更新
      # 方法存在，卡片和语料都没有支撑这个否定）；"必须/只能用 Lua"这类
      # 排他性结论（CR-052 已改卡片为"脚本是上文示例的一种方式"，不是
      # 唯一方式）。
      #
      # CR-060（2026-09-07）：命中这两条 forbid_patterns **不再自动判定
      # 这道题失败**——CR-054~060 六轮反复调整"命中之后要不要自动判断
      # 这次命中是否被否定"（先加否定语境过滤、再修跨命题窗口泄漏、再修
      # 分句边界不认转折/加合连词……），每次都在打补丁却总能被新句式
      # 绕过，根因是想用正则回答一个句法结构问题。现在的规则很简单：
      # 命中就记入 `forbidden_hit`，在报告里显著标出"待人工复核"，不再
      # 自动计入 failures/影响这道题的通过判定——由人工核对这次命中到底
      # 是真实越界断言还是已被正确否定的表述。见
      # `packages/evaltools/run_scenarios.py` `_score()` 上方的完整说明。
      - "(?i)(仅支持.{0,6}(原子)?(增减|递增|递减|increment)|only support.{0,10}(atomic )?increment(/decrement)?)"
      # CR-054：R50 复审用重新校准的真实输出发现"需使用 Lua 脚本"这句
      # 没被上面这条覆盖——"必须/只能/唯一"这几个词太窄，"需/需要"同样是
      # CR-052 已撤回的排他性表述，已补进触发词。
      - "(?i)((必须|只能|需要?|唯一(的)?(方法|方式|办法)|only way|must|need).{0,10}(Lua|脚本|script))"
    expect_sources: [spring-data-redis]

  # ------------------------------------------------------------------
  # 第四张卡片：PostgreSQL 慢 SQL 诊断
  # （knowledge/scenarios/postgres-slow-query-diagnosis.md，6 个小节，
  #  全部引用 postgresql 17 官方文档已入库的真实块）
  #
  # 8 题覆盖 6 个小节：§1 两题（归一化文本 / total 与 mean 的区别）、
  # §2 一题（auto_explain.log_analyze 的代价）、§3 两题（先看行数估计
  # 而不是 cost / loops 是每次执行的平均值）、§4 一题（LIMIT 造成的
  # 估计与实际不符不是估计错误）、§5 一题（列相关导致的错估重跑
  # ANALYZE 无用）、§6 一题（覆盖索引受可见性映射制约）。
  #
  # keypoint 写法沿用前三批的教训：概念性关键点必须中英文都能命中
  # （`--language zh` 时模型用中文作答），标识符类（`$1`、`loops`、
  # `auto_explain.log_analyze`、`CREATE STATISTICS`、`visibility map`）
  # 保留英文，因为这些在中文答案里也会原样出现。
  # ------------------------------------------------------------------

  # 校准记录（本轮）：这题原问法是"是不是当时执行慢的那条语句的原文"，
  # 实测本地答案把它读成了"能不能定位到那一次慢执行"（答"不保证是执行慢的
  # 那条"），而卡片小节讲的是另一件事——文本本身是归一化后的代表文本、
  # 字面常量被换成 $1。**问法有两种读法是本轮出题的缺陷**，改成只问文本
  # 形态（"和应用实际发出去的 SQL 是不是逐字一样"），不是因为答不中就放宽
  # 判据：两条 keypoint 一字未改。
  - q: "pg_stat_statements 的 query 列显示的语句，和应用实际发出去的 SQL 是逐字一样的吗"
    expect_keypoints:
      # 结论：不是原文（归一化后的代表文本）
      - "(?i)(不是|并非|不一定|not the|规范化|归一化|normaliz|代表性?(的)?(文本|语句|查询)|representative)"
      # 依据：字面常量被替换成 $1 这类参数符号
      - "(?i)(\\$1|常量|字面量|参数符号|placeholder|literal)"
    expect_sources: [postgresql]

  - q: "想从 pg_stat_statements 里挑出最该优化的语句，按 total_exec_time 排和按 mean_exec_time 排有什么不同"
    expect_keypoints:
      - "(?i)(total_exec_time|累计|总(的)?(执行)?(时间|耗时)|总耗时)"
      - "(?i)(mean_exec_time|平均|单次|每次|per.?call)"
    expect_sources: [postgresql]

  - q: "线上偶发的慢查询抓不到执行计划，打开 auto_explain 的 log_analyze 有什么代价"
    expect_keypoints:
      # 代价的关键在于"所有语句都被计时"，不只是被记录下来的那些
      - "(?i)(所有|全部|每(一)?(条|个)|不(只|仅)是?.{0,12}(慢|被记录|记录下来)|all statements|whether or not)"
      - "(?i)(性能|开销|overhead|impact|影响|变慢|代价)"
    expect_sources: [postgresql]

  - q: "EXPLAIN ANALYZE 输出里 cost 和 actual time 数值对不上，是不是就说明计划有问题；应该先看哪个数"
    expect_keypoints:
      # cost 是任意单位、和毫秒不可比
      - "(?i)(任意单位|arbitrary|单位不同|不同的?单位|不(可|能)(直接)?比较|不(一定|会).{0,8}(对应|匹配)|unlikely to match)"
      # 真正该先看的是行数估计与实际的差距
      # 校准：补入"估算"这个同义词——实测答案写的是"实际行数远低于估算"，
      # 与"估计/预估"是同一个概念的常见写法，属于正则过窄，不是放宽标准
      # （沿用第 18 题"没有→没有|无法|不能"那次同类修正的口径）。
      - "(?i)((估计|预估|估算|estimated).{0,12}(行数|rows)|行数.{0,12}(估计|预估|估算|接近|偏差|差距)|rows.{0,12}(estimate|actual))"
    expect_sources: [postgresql]

  - q: "嵌套循环内层的 Index Scan 节点 actual time 只有 0.003 毫秒，是不是说明这个节点不耗时"
    expect_keypoints:
      - "(?i)loops"
      - "(?i)(平均|每次(执行)?|per.?execution|乘(以)?|multiply|总(的)?(时间|耗时))"
    expect_sources: [postgresql]

  - q: "计划里 Index Scan 估计返回 10 行、实际只有 2 行，外面套着 LIMIT 2，这是统计信息不准吗"
    expect_keypoints:
      # 结论：不是估计错误
      - "(?i)(不是|并非|不属于|not an? estimation error|不能算|无需)"
      # 依据：LIMIT 让节点提前停止取行 / 估计按跑完整来显示
      - "(?i)(LIMIT|提前(停止|结束)|停(止|下)|stopped short|跑完|run to completion|取(够|满)|够了就)"
    expect_sources: [postgresql]

  - q: "两个 WHERE 条件涉及的列都刚 ANALYZE 过，行数估计还是差好几个数量级，再跑一次 ANALYZE 有用吗"
    expect_keypoints:
      - "(?i)(相关|correlat|独立(性)?假设|independent)"
      - "(?i)(CREATE STATISTICS|扩展统计|多元统计|multivariate|extended statistics)"
    expect_sources: [postgresql]

  - q: "已经建了包含查询所有列的覆盖索引，为什么执行时还是要回表访问堆，没有变快"
    expect_keypoints:
      - "(?i)(visibility map|可见性(映射|图|位图)?|all.?visible)"
      - "(?i)(MVCC|可见性|快照|snapshot|heap|堆(表|页)?|回表)"
    expect_sources: [postgresql]
