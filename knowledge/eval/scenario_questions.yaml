      - "(?i)(原子|atomic|一次(性)?|single)"
    expect_sources: [spring-data-redis]

  - q: "每次执行 Redis 的 Lua 脚本都要把脚本内容重新发一遍给服务器吗，会不会很慢"
    expect_keypoints:
      - "(?i)(sha1?|evalsha)"
      - "(?i)(缓存|cache|不需要|不用|无需|only.{0,10}first|falling back)"
    forbid_patterns:
    # 负向约束补于 R71（2026-09-09）：CR-067 立的"是非题必须配负向约束"
    # 这条规则，此前只被门禁检查了最近一批题（`_QUESTIONS_YAML[-8:]`），
    # 前三张卡片的六道是非题实际上一条都没有。门禁改成遍历全量后，这六题
    # 一并补齐。写法沿用 CR-067：只抓"结论反过来"的那种肯定式主张，并把
    # 否定词从中间的间隔类里排除（`[^。；\n不]`），避免把正确答案里的
    # 否定表述一起命中。
      # 反转："每次都要把脚本原文发给服务器"。只抓"发送/上传脚本内容"，
      # 不抓"每次重新编译"这类正确的风险提示。
      - "(?i)((每次|每一次)[^。；\\n不]{0,10}(都)?[^。；\\n不]{0,6}(重新)?(发送|上传|传输|发一遍)[^。；\\n不]{0,6}(脚本|内容|全文)|(每次|每一次)[^。；\\n不]{0,14}脚本(内容|全文)?[^。；\\n不]{0,8}(重新)?(发送|上传|传输|发一遍|发给)|(必须|需要)[^。；\\n不]{0,8}(每次|每回)[^。；\\n不]{0,8}(发送|上传)[^。；\\n不]{0,6}脚本)"
    expect_sources: [spring-data-redis]

  # CR-053：这题原先问"能不能直接用 RedisAtomicLong 这类计数器"，措辞较宽，
  # 容易诱导模型对整个类的能力边界下断言（真实一次生成给出"仅支持原子增减，
  # 无法实现读改写完整逻辑"——这本身是越界断言，CR-052 已指出公开 API 还有
  # compareAndSet 等方法，只是这些细节不在已入库语料里）。收窄问法，明确问
  # "调用无条件的递增/递减操作"这一件已入库卡片确实支持的具体事实，减少
  # 诱导模型对整个类下过强结论的空间；同时新增 forbid_patterns 作为兜底——
  # 就算问法收窄后模型仍然给出同类越界断言，也不能因为两条正向 keypoint
  # 凑巧命中就判通过。
  - q: "spring-data-redis 的 RedisAtomicLong 这类原子计数器，如果只调用它的无条件递增/递减操作来做库存扣减，能不能防止超卖"
    expect_keypoints:
      - "(?i)(不能|不行|不足以|does.{0,10}not|cannot)"
      # 放宽"没有"为"没有|无法|不能/不会"，覆盖"无法判断库存是否充足"这类
      # 同义表述——这是校准发现的正则过窄问题，不是放宽判据标准本身。
      - "(?i)(单个?命令|single command|(没有|无法|不(能|会)).{0,8}(条件|判断|检查|阈值)|no.{0,10}(condition|check))"
    forbid_patterns:
      # CR-053 指出的具体越界断言：整个类"仅支持原子增减"（否定 CAS/更新
      # 方法存在，卡片和语料都没有支撑这个否定）；"必须/只能用 Lua"这类
      # 排他性结论（CR-052 已改卡片为"脚本是上文示例的一种方式"，不是
      # 唯一方式）。
      #
      # CR-060（2026-09-07）：命中这两条 forbid_patterns **不再自动判定
      # 这道题失败**——CR-054~060 六轮反复调整"命中之后要不要自动判断
      # 这次命中是否被否定"（先加否定语境过滤、再修跨命题窗口泄漏、再修
      # 分句边界不认转折/加合连词……），每次都在打补丁却总能被新句式
      # 绕过，根因是想用正则回答一个句法结构问题。现在的规则很简单：
      # 命中就记入 `forbidden_hit`，在报告里显著标出"待人工复核"，不再
      # 自动计入 failures/影响这道题的通过判定——由人工核对这次命中到底
      # 是真实越界断言还是已被正确否定的表述。见
      # `packages/evaltools/run_scenarios.py` `_score()` 上方的完整说明。
      - "(?i)(仅支持.{0,6}(原子)?(增减|递增|递减|increment)|only support.{0,10}(atomic )?increment(/decrement)?)"
      # CR-054：R50 复审用重新校准的真实输出发现"需使用 Lua 脚本"这句
      # 没被上面这条覆盖——"必须/只能/唯一"这几个词太窄，"需/需要"同样是
      # CR-052 已撤回的排他性表述，已补进触发词。
      - "(?i)((必须|只能|需要?|唯一(的)?(方法|方式|办法)|only way|must|need).{0,10}(Lua|脚本|script))"
    expect_sources: [spring-data-redis]

  # ------------------------------------------------------------------
  # 第四张卡片：PostgreSQL 慢 SQL 诊断
  # （knowledge/scenarios/postgres-slow-query-diagnosis.md，6 个小节，
  #  全部引用 postgresql 17 官方文档已入库的真实块）
  #
  # 8 题覆盖 6 个小节：§1 两题（归一化文本 / total 与 mean 的区别）、
  # §2 一题（auto_explain.log_analyze 的代价）、§3 两题（先看行数估计
  # 而不是 cost / loops 是每次执行的平均值）、§4 一题（LIMIT 造成的
  # 估计与实际不符不是估计错误）、§5 一题（列相关导致的错估重跑
  # ANALYZE 无用）、§6 一题（覆盖索引受可见性映射制约）。
  #
  # keypoint 写法沿用前三批的教训：概念性关键点必须中英文都能命中
  # （`--language zh` 时模型用中文作答），标识符类（`$1`、`loops`、
  # `auto_explain.log_analyze`、`CREATE STATISTICS`、`visibility map`）
  # 保留英文，因为这些在中文答案里也会原样出现。
  # ------------------------------------------------------------------

  # ==================================================================
  # CR-066（codex R60 审查，2026-09-08）：本卡片第一版的 8 条题目
  # **只检查术语出现，不约束结论方向**——审查方用保存下来的真实报告
  # 复现：第 20 题的答案里写着"若关注单次极端延迟，可看 total_exec_time"
  # （卡片明确说单次最坏延迟看 mean/max，不是 total），却因为"总耗时"和
  # "平均"两个词都出现而被判 passed；又以纯 `_score()` 构造反例证明第 22
  # 题能让一个结论完全相反的答案两条 keypoint 全中。
  #
  # 修法分两个通道，**它们能做的事不一样，不要混为一谈**：
  #
  # 1. **正向 keypoint 改成"绑定"而不是"词表"**——不再问"答案里有没有
  #    出现 total_exec_time / 平均 / loops"，而是问"答案有没有把这个词
  #    和它正确的含义连在一句话里说"（例如 `total_exec_time` 必须出现在
  #    "累计/总耗时"附近，`loops` 必须出现在"总耗时/乘"附近）。绑定式
  #    正则能挡住"把术语背对了"这类真实错误答案。
  # 2. **结论方向靠 `forbid_patterns` + 人工复核**——正向正则在原理上
  #    挡不住"事实都说对了、最后结论反过来"的答案：对手只要把两条事实
  #    也一起写进去就能全中（CR-066 给的 Q22 反例正是这么构造的）。
  #    这类只能落进既有的三态通道：命中 → `review_required` → 人来看。
  #    这不是偷懒，是 CR-054~060 六轮教训的直接结论：正则判断不了
  #    "这句话到底是在肯定还是在否定这个主张"。
  #
  # 因此下面每道**带是非/选择结论**的题都补了一条负向约束，覆盖审查方
  # 点名的 Q20（累计 vs 单次极值）、Q22（对不上不等于计划有问题）、
  # Q23（每次平均值不代表总耗时），另外顺带修了同一批里同样只查词表的
  # Q19/Q21/Q24/Q25。判别性证明在
  # `tests/unit/test_scenario_eval_gate.py`（CR-066 一节）：每条新规则都
  # 附一个"旧规则会放行、新规则不会"的具体例句，其中 Q20 用的是保存报告
  # 里的**真实输出**、Q22 用的是审查方给出的原话反例。
  # ==================================================================

  # 校准记录（R60）：这题原问法是"是不是当时执行慢的那条语句的原文"，
  # 实测本地答案把它读成了"能不能定位到那一次慢执行"（答"不保证是执行慢的
  # 那条"），而卡片小节讲的是另一件事——文本本身是归一化后的代表文本、
  # 字面常量被换成 $1。**问法有两种读法是 R60 出题的缺陷**，改成只问文本
  # 形态（"和应用实际发出去的 SQL 是不是逐字一样"）。
  - q: "pg_stat_statements 的 query 列显示的语句，和应用实际发出去的 SQL 是逐字一样的吗"
    expect_keypoints:
      # 结论：不是原文（归一化后的代表文本）。
      # CR-066：原来的 `不是|并非|不一定|not the` 是**纯否定词表**，
      # 一句"不一定完全一致，取决于 search_path，常量原样保留不会被替换"
      # （结论恰好相反：否认归一化）照样命中。改成必须出现归一化/代表
      # 文本这个机制词，或者明确否定"逐字等于原文"这件事本身。
      - "(?i)(规范化|归一化|normaliz|代表性?(的)?(文本|语句|查询)|representative|(不是|并非|不(会|一定)是)[^。；\\n]{0,8}(原文|原始|逐字|一模一样))"
      # 依据：字面常量被替换成 $1 这类参数符号
      - "(?i)(\\$1|常量|字面量|参数符号|placeholder|literal)"
    forbid_patterns:
      # CR-067（codex R61 复审）：CR-066 只给 Q20/Q22/Q23 配了负向约束，
      # 把这题当成"绑定式正向关键点就够了"的例外。审查方复现的反例是
      # "语句会归一化，常量显示 $1，**但 query 仍逐字等于原文**"——机制
      # 讲对了、结论在下一句反转，两条 keypoint 照样全中。这正是 R61
      # 自己定义为"正向正则判不了、必须进人工复核"的形状，没有理由只
      # 对被点名的三题成立。
      # 写法上锚定"肯定性副词 + 等同判断"（仍/依然/确实/其实…等于原文），
      # 而不是裸的"逐字一样"——后者会连正确答案里的"**不是**逐字一样"
      # 一起命中，把这题永久钉在 review_required 上。**代价如实登记**：
      # 不带这类副词的反转（"query 逐字等于原文"单说一句）逃得掉。
      - "(?i)((仍|仍然|依然|还是|确实|其实|就)[^。；\\n]{0,8}(逐字|原样|一字不差)?[^。；\\n]{0,6}(等于|一样|相同|一致)[^。；\\n]{0,8}(原文|原始|实际发出)|(query|文本)[^。；\\n]{0,8}(就是|即为|等同于)[^。；\\n]{0,8}(原文|原始))"
    expect_sources: [postgresql]

  # CR-066 点名的第一道题（审查方用真实输出复现过误放行）。
  - q: "想从 pg_stat_statements 里挑出最该优化的语句，按 total_exec_time 排和按 mean_exec_time 排有什么不同"
    expect_keypoints:
      # 绑定式：`total_exec_time` 必须和"累计/总耗时"出现在同一句里，
      # 光出现这个字段名不算（旧规则就是这么放行的）。
      - "(?i)(total_exec_time[^。；\\n]{0,24}(累计|总(计|共|的)?[^。；\\n]{0,4}(时间|耗时))|(累计|总(计|共|的)?[^。；\\n]{0,4}(时间|耗时))[^。；\\n]{0,24}total_exec_time)"
      - "(?i)(mean_exec_time[^。；\\n]{0,24}(平均|单次|每次)|(平均|单次|每次)[^。；\\n]{0,24}mean_exec_time)"
    forbid_patterns:
      # 真实误放行的那句："若关注单次极端延迟，可看 total_exec_time"。
      # 单次/极端延迟应当看 mean_exec_time/max_exec_time，`total_exec_time`
      # 是跨调用累计量。两条 keypoint 仍会全中（这个答案确实分别讲对了
      # 两个字段的定义），所以只能靠这条负向约束把它拦成待复核。
      - "(?i)(单次|每次|单条|极端|最(慢|坏|大))[^。；\\n]{0,20}total_exec_time"
      # 镜像的错法：把"累计总耗时"指向 mean_exec_time。要求带"看/用/按"
      # 这类明确的建议动词，避免误伤"total_exec_time 是总耗时，而
      # mean_exec_time 是平均"这种正确的并列说明。
      - "(?i)(累计|总(计|的)?(耗时|时间|执行时间))[^。；\\n]{0,16}(看|用|按|参考|选)[^。；\\n]{0,6}mean_exec_time"
    expect_sources: [postgresql]

  - q: "线上偶发的慢查询抓不到执行计划，打开 auto_explain 的 log_analyze 有什么代价"
    expect_keypoints:
      # 代价的关键在于"所有语句都被计时"，不只是够慢、被记录下来的那些。
      # CR-066：旧规则只要出现"所有/全部/每条"就算命中，一句"会记录所有
      # 超过阈值的慢语句，性能开销可以忽略"照样通过。改成必须把"所有
      # 语句"和"计时/测量"绑在一起说，或者明确点出"不只是被记录的那些"。
      - "(?i)((所有|全部|每(一)?(条|个))[^。；\\n]{0,12}(语句|查询|statement)[^。；\\n]{0,20}(计时|定时|测量|timing|采样)|(不(只|仅)是?|whether or not)[^。；\\n]{0,20}(被?记录|logged|够慢|慢(查询|语句)))"
      - "(?i)(性能|开销|overhead|impact|影响|变慢|代价)"
    forbid_patterns:
      # 结论方向反了的典型说法：把这项代价说成可以忽略。官方原文是
      # "extremely negative impact on performance"。
      - "(?i)(开销|代价|影响|损耗)[^。；\\n]{0,10}(可以)?(忽略|很小|不大|极小|微乎其微|可控)"
    expect_sources: [postgresql]

  # CR-066 点名的第二道题（审查方以纯 `_score()` 构造反例复现）。
  - q: "EXPLAIN ANALYZE 输出里 cost 和 actual time 数值对不上，是不是就说明计划有问题；应该先看哪个数"
    expect_keypoints:
      # cost 是任意单位、和毫秒不可比
      - "(?i)(任意单位|arbitrary|单位不同|不同的?单位|不(可|能)(直接)?比较|不(一定|会).{0,8}(对应|匹配)|unlikely to match)"
      # 真正该先看的是行数估计与实际的差距
      # 校准（R60）：补入"估算"这个同义词——实测答案写的是"实际行数远低于
      # 估算"，与"估计/预估"是同一个概念的常见写法，属于正则过窄。
      - "(?i)((估计|预估|估算|estimated).{0,12}(行数|rows)|行数.{0,12}(估计|预估|估算|接近|偏差|差距)|rows.{0,12}(estimate|actual))"
    forbid_patterns:
      # 审查方给的反例原话："**是**，cost 虽然是任意单位，估算行数也要和
      # 实际比较，但只要两者对不上就说明计划有问题。"——两条 keypoint 全中，
      # 结论却和官方相反。正向正则原理上挡不住这种"事实全对、结论反过来"
      # 的构造（把两条事实也写进去即可），只能进三态通道交人工复核。
      # **已知代价（如实登记）**：这条 pattern 同样会命中一句正确的否定
      # 表述（"cost 与 actual time 不对齐**不**代表计划有问题"），因为
      # 区分这两者正是 CR-054~060 证明正则做不到的事。当答案还缺关键点时
      # 这题本来就判 failed（failures 优先于 forbidden_hit），命中不会
      # 额外增加噪声；只有当答案两条关键点全中时才需要人看一眼。
      - "(?i)(对不上|不(一致|匹配|对齐|符)|有差(距|异))[^。；\\n]{0,16}(就|即|则)?[^。；\\n]{0,6}(说明|意味|代表|表示|证明)[^。；\\n]{0,12}(计划)?[^。；\\n]{0,6}有问题"
    expect_sources: [postgresql]

  # CR-066 点名的第三道题。
  - q: "嵌套循环内层的 Index Scan 节点 actual time 只有 0.003 毫秒，是不是说明这个节点不耗时"
    expect_keypoints:
      - "(?i)loops"
      # 绑定式：光提一句"平均"没有意义，必须把"每次/平均/loops"和"总耗时/
      # 乘"连起来说，才是卡片那条事实（actual time 是每次执行的平均值，
      # 要乘 loops 才是这个节点的总时间）。旧规则下一句"loops 只是循环
      # 次数，平均值已经足够说明问题"也能全中。
      - "(?i)((loops|每次|平均)[^。；\\n]{0,24}(乘|×|总(的)?(时间|耗时))|总(的)?(时间|耗时)[^。；\\n]{0,24}(loops|乘|平均))"
    forbid_patterns:
      # 结论方向反了：直接断言这个节点不耗时。
      - "(?i)(说明|意味|表示|确实|因此|所以)[^。；\\n]{0,12}(该|这个)?(节点)?[^。；\\n]{0,6}不(耗时|费时|花时间)"
    expect_sources: [postgresql]

  - q: "计划里 Index Scan 估计返回 10 行、实际只有 2 行，外面套着 LIMIT 2，这是统计信息不准吗"
    expect_keypoints:
      # 结论：不是估计错误。CR-066：旧规则是裸否定词表（`不是|并非|不属于|
      # 不能算|无需`），任何一句带"不"的话都能命中；改成必须把否定和
      # "统计信息/估计不准"这个具体主张绑在一起。
      - "(?i)((不是|并非|不属于)[^。；\\n]{0,6}(统计(信息)?|估计|估算)[^。；\\n]{0,6}(不准|不对|错误|有问题|过时)|not an? estimation error|(不是|并非)[^。；\\n]{0,12}估计错误)"
      # 依据：LIMIT 让节点提前停止取行 / 估计按跑完整来显示
      - "(?i)(LIMIT|提前(停止|结束)|停(止|下)|stopped short|跑完|run to completion|取(够|满)|够了就)"
    forbid_patterns:
      # CR-067：审查方的反例是"不是统计信息不准；LIMIT 会提前停止，
      # **但这依然说明统计信息不准**"——先答对、再反转，两条 keypoint
      # 全中。同样锚定肯定性副词，避免误伤正确答案里的"不是统计信息
      # 不准"；另加一条"建议去重新收集统计/跑 ANALYZE"的行动建议形式，
      # 因为反转结论经常以建议的样子出现而不带副词。
      - "(?i)((依然|仍然|仍|确实|还是|其实|终究)[^。；\\n]{0,10}(说明|意味|表明|就是|是)?[^。；\\n]{0,6}统计(信息)?[^。；\\n]{0,6}(不准|不对|过时|有问题)|(需要|应该|建议)[^。；\\n]{0,10}(重新)?(收集|更新|跑|执行)[^。；\\n]{0,8}(统计信息|ANALYZE))"
    expect_sources: [postgresql]

  - q: "两个 WHERE 条件涉及的列都刚 ANALYZE 过，行数估计还是差好几个数量级，再跑一次 ANALYZE 有用吗"
    expect_keypoints:
      - "(?i)(相关|correlat|独立(性)?假设|independent)"
      - "(?i)(CREATE STATISTICS|扩展统计|多元统计|multivariate|extended statistics)"
      # CR-066 新增第三条：这题问的是"再跑一次 ANALYZE 有用吗"，前两条
      # 只验证答案提到了相关性和扩展统计，一句"再跑一次 ANALYZE 就能修好，
      # 也可以用 CREATE STATISTICS"照样两条全中，结论却是错的。这条要求
      # 答案明确给出"重跑 ANALYZE 解决不了"这个方向。
      - "(?i)(ANALYZE[^。；\\n]{0,12}((无|没)用|不(能|会|行)|无法|解决不了|修不好)|((无|没)用|不(能|会|足以)|无法|解决不了)[^。；\\n]{0,10}(通过|靠|用)?[^。；\\n]{0,6}ANALYZE)"
    forbid_patterns:
      # CR-067：审查方的反例是"…再跑 ANALYZE 没用，**但总体重跑 ANALYZE
      # 就能解决**"——第三条 keypoint 被前半句满足，后半句把结论反过来。
      # 这条抓的是"重跑 ANALYZE 就能解决"这个肯定式主张本身（含
      # "只要/只需 ANALYZE 就…"），正确答案里的"再跑一次 ANALYZE 也没用"
      # 不会命中。
      - "(?i)((重新|重|再)(跑|执行|运行|做)?[^。；\\n]{0,8}ANALYZE[^。；\\n]{0,10}(就(能|可以)|即可|便(能|可))[^。；\\n]{0,8}(解决|修复|搞定|恢复|改善|修正)|(只要|只需)[^。；\\n]{0,12}ANALYZE[^。；\\n]{0,10}(就|即))"
    expect_sources: [postgresql]

  # 这题问的是"为什么"，不是是非题：解释本身就是方向，可见性映射这条
  # 事实性关键点无法被一个结论相反的答案顺带命中，因此不补负向约束。
  - q: "已经建了包含查询所有列的覆盖索引，为什么执行时还是要回表访问堆，没有变快"
    expect_keypoints:
      - "(?i)(visibility map|可见性(映射|图|位图)?|all.?visible)"
      - "(?i)(MVCC|可见性|快照|snapshot|heap|堆(表|页)?|回表)"
    expect_sources: [postgresql]

  # ---- 第五张卡片：Kubernetes 滚动发布卡住（knowledge/scenarios/kubernetes-rollout-stuck.md）----
  #
  # 出题方式与前四批相同：先按卡片的 8 个小节各挑一条"排查时真会被问到、
  # 且卡片正文确实写了"的事实，再把它写成中文问法。判据沿用 CR-066/067
  # 定下的两条规则：
  #   1. 关键点写成**绑定式**——机制词必须和它承载的结论出现在同一句里，
  #      光出现字段名/术语不算命中；
  #   2. **是非题必须配负向约束**——正向正则原理上挡不住"事实全对、结论
  #      反过来"的答案（CR-066/067 各复现过一次），这类题命中 forbid 后
  #      进人工复核通道，不自动判过。
  # 本批 10 题里有 5 道是非题（Q28/Q31/Q34/Q35/Q36），全部配了 forbid_patterns。
  #
  # 负向正则里凡是要抓"肯定式反转"的，都用 `(?<!不)` 这类定长逆序断言把
  # 正确答案里的否定形式排除掉——例如 Q29 的"会自动回滚"必须排除"不会
  # 自动回滚"，否则这题会被永久钉在 review_required 上（CR-067 处理 Q23
  # 时踩过同一个坑，那次是靠"肯定性副词"绕开的）。

  - q: "Deployment 没配 maxUnavailable，滚动更新时默认最多允许多少 Pod 不可用；写成百分比时怎么换算成具体 Pod 数"
    expect_keypoints:
      # 绑定式：25% 必须和"默认"连在一起说，光出现一个 25% 不算。
      - "(?i)((默认|缺省|default)[^。；\\n]{0,16}25\\s*%|25\\s*%[^。；\\n]{0,16}(默认|缺省|default))"
      # 百分比换算成绝对数是**向下**取整（不是四舍五入，也不是向上）。
      - "(?i)(向下[^。；\\n]{0,4}取整|round(ing|ed)?\\s*down|舍去小数|取整[^。；\\n]{0,6}向下)"
    expect_sources: [kubernetes]

  - q: "发布卡了十几分钟一直没推进，Kubernetes 会自己回滚到上一个版本吗"
    expect_keypoints:
      # 结论：不会自动回滚。绑定"回滚"这个动作本身，不用裸否定词表。
      - "(?i)((不会|不能|没有|不做|不进行)[^。；\\n]{0,10}(自动)?[^。；\\n]{0,6}回滚|回滚[^。；\\n]{0,10}(需要|要靠|由)[^。；\\n]{0,12}(你|自己|CD|流水线|工具|上层))"
      # 它做的事只是报一个状态条件。
      # 校准（本轮实测）：本地答案写的是"需手动检查 `Progressing` 状态为
      # `False` 后执行回滚"——它确实说出了"Kubernetes 只把结果登记成状态
      # 条件"这件事，只是没有逐字写 ProgressDeadlineExceeded。补一条
      # `Progressing … False` 的绑定式写法（条件名 + 它的取值，仍然不是
      # 裸词表），不放宽到"只要提到 Progressing 就算"。
      - "(?i)(ProgressDeadlineExceeded|(只|仅)[^。；\\n]{0,10}(报告|上报|标记|记录|设置)[^。；\\n]{0,10}(状态|condition|条件)|Progressing[^。；\\n]{0,16}(False|false))"
    forbid_patterns:
      # 结论反转："（超过 deadline 后）会自动回滚"。用 (?<!不)/(?<!不会)
      # 排除正确答案里的否定形式；"不会自动回滚"不命中。
      - "(?i)((?<!不)(?<!没)会[^。；\\n]{0,6}自动[^。；\\n]{0,4}回滚|自动[^。；\\n]{0,4}回滚到[^。；\\n]{0,10}(上一个|上一版|之前)[^。；\\n]{0,6}版本)"
    expect_sources: [kubernetes]

  # 出题缺陷（本轮实测后改写，保留记录）：原问法是"想在 CI 流水线里判断
  # 这次发布到底成没成功…"，全句没有任何指向 Kubernetes 的线索，本地答案
  # 去讲了 Spring Boot 的 `pack build` 与 cAdvisor——那个答案对着"发布"
  # 这个词并不算错，是**问题本身有两种读法**，与 R60 改写 Q19 同一类
  # 处理。补上 "Deployment 这次滚动发布" 使问题唯一。这不是为了让它变绿：
  # 改写后它仍然只是问法明确了，答对与否照旧由关键点判。
  - q: "想在 CI 流水线里判断 Deployment 这次滚动发布到底成没成功，用什么命令、看什么信号"
    expect_keypoints:
      - "(?i)kubectl\\s+rollout\\s+status"
      # 绑定式：必须把这个命令和"退出码/exit code"这个可判定信号连起来说，
      # 光提一句命令名不算——流水线要的是机器可判的信号。
      - "(?i)((退出码|返回码|exit\\s*code|\\$\\?)[^。；\\n]{0,20}(非零|不为\\s*0|非\\s*0|1|0)|(非零|非\\s*0)[^。；\\n]{0,12}(退出码|返回码|exit))"
    expect_sources: [kubernetes]

  - q: "新版本 Pod 一直是 0/1 但没有重启，和不停重启的 Pod，分别该去查哪个探针"
    expect_keypoints:
      # 绑定式：readiness 必须和"不就绪/不给流量"绑定。
      - "(?i)((readiness|就绪)[^。；\\n]{0,24}(不就绪|不(会|再)?接(收|受)流量|摘(掉|除)|不(给|发)流量|not ready)|(不就绪|0/1|不接流量)[^。；\\n]{0,24}(readiness|就绪探针))"
      # 绑定式：liveness/startup 必须和"重启/杀掉容器"绑定。
      - "(?i)((liveness|startup|存活|启动)[^。；\\n]{0,24}(重启|杀(掉|死)|kill|restart)|(重启|杀(掉|死))[^。；\\n]{0,24}(liveness|startup|存活探针|启动探针))"
    expect_sources: [kubernetes]

  - q: "容器压根没配 readiness probe，kubelet 会认为它一直不就绪吗"
    expect_keypoints:
      # 结论：没配探针一律按 Success 处理，也就是直接算就绪。
      - "(?i)((没(有)?配置?|未配置|不提供|没有该?|缺少)[^。；\\n]{0,16}(探针|probe)[^。；\\n]{0,20}(Success|成功|就绪|ready|通过)|(Success|成功|就绪)[^。；\\n]{0,16}(没(有)?配置?|未配置|不提供)[^。；\\n]{0,10}(探针|probe))"
      # 后果：进程还没准备好也会被算成就绪 / 流量会打进来。
      # 校准（本轮实测）：本地答案写的是"不会阻断流量""Pod 会持续接收
      # 流量"——正是这条关键点要问的后果，只是措辞落在"流量"这一侧而不是
      # "进程还没准备好"那一侧。补两种真实出现过的写法。
      - "(?i)(还没|尚未|没(有)?(真正)?(准备好|加载完|预热)|启动(还)?没完成|仍在(启动|加载|预热)|流量[^。；\\n]{0,10}(就|已|会)[^。；\\n]{0,6}(打|进|转发)|(不会|不再)[^。；\\n]{0,6}(阻断|拦截|挡住)[^。；\\n]{0,4}流量|(接收|接受|收到)[^。；\\n]{0,6}流量)"
    forbid_patterns:
      # 结论反转：说"没配探针就会一直不就绪 / 就绪检查不通过"。
      - "(?i)((没(有)?配置?|未配置|不提供|缺少)[^。；\\n]{0,16}(探针|probe|readiness)[^。；\\n]{0,16}(就)?(会)?[^。；\\n]{0,6}(一直)?(不就绪|不会就绪|not ready|判定失败|视为失败))"
    expect_sources: [kubernetes]

  - q: "Java 服务启动要 90 秒，livenessProbe 每次都在启动过程中把容器杀掉重启，官方推荐怎么配"
    expect_keypoints:
      # 正确方向：加 startup probe，而不是一味调大 liveness 的 initialDelaySeconds。
      - "(?i)(startup\\s*probe|启动探针)"
      # 绑定式：要么给出那个判定式，要么明确"把 startupProbe 的
      # failureThreshold 调大、同时不动 liveness 的默认值"。
      # 校准（本轮实测）：本地答案给的是"其 failureThreshold ≥ 30"——
      # 用具体数值表达了"设得足够大"，形式上却不含任何形容词。补一条
      # "failureThreshold 绑定一个两位数以上的阈值"的写法；仍然是绑定式
      # （字段名 + 取值），不是单独出现 failureThreshold 就算。
      - "(?i)(initialDelaySeconds\\s*\\+\\s*failureThreshold|failureThreshold[^。；\\n]{0,12}(×|\\*|乘)[^。；\\n]{0,12}periodSeconds|failureThreshold[^。；\\n]{0,20}(调大|加大|设大|设置得?足够|够大)|failureThreshold[^。；\\n]{0,12}(≥|>=|大于等于|为|设为|=)\\s*(1[0-9]|[2-9][0-9]|[0-9]{3}))"
    expect_sources: [kubernetes]

  - q: "Pod 状态是 CrashLoopBackOff，这个状态本身能说明失败原因吗"
    expect_keypoints:
      # 结论：它描述的是重启退避机制，不是原因。
      # 校准（本轮实测）：本地答案写的是"不能，CrashLoopBackOff 仅表明 Pod
      # 启动失败且持续重启，具体原因需结合日志…判断"——这就是这条关键点
      # 要的结论（状态只描述现象，不给原因），但用的是"仅表明…"和"不能"，
      # 落在原正则的三种写法之外。补两条，仍然要求把"只/不能"和"原因/重启"
      # 绑在一起说。
      - "(?i)((退避|backoff|重启(延迟|间隔))[^。；\\n]{0,20}(状态|机制|生效)|(不是|并非|不代表|说明不了)[^。；\\n]{0,12}(具体)?(原因|根因|错误本身)|(仅|只)[^。；\\n]{0,8}(表明|说明|表示|代表|意味)[^。；\\n]{0,24}(重启|启动失败)|不能[^。；\\n]{0,10}(说明|判断|确定|得出)[^。；\\n]{0,10}(原因|根因))"
      # 该怎么查：日志 / 事件。
      - "(?i)(kubectl\\s+logs|kubectl\\s+describe\\s+pod|看日志|查日志|事件|events)"
    forbid_patterns:
      # 结论反转：直接断言这个状态就等于应用有 bug / 就是崩溃原因。
      - "(?i)((?<!不)(?<!并非)(说明|表示|意味|就是|即)[^。；\\n]{0,10}(应用|程序|代码)[^。；\\n]{0,6}(有\\s*bug|有问题|写错)|CrashLoopBackOff[^。；\\n]{0,10}(就(是|等于)|即为)[^。；\\n]{0,10}(原因|根因))"
    expect_sources: [kubernetes]

  - q: "容器隔一阵就没了、应用日志里什么都没留下，怎么确认是不是内存超限被杀的"
    expect_keypoints:
      # 查法：kubectl describe pod，看 Last State 的 Reason。
      - "(?i)(kubectl\\s+describe\\s+pod|Last\\s*State|上一次(的)?状态)"
      # 证据：OOMKilled（可带 137）。
      - "(?i)(OOMKilled|退出码\\s*137|Exit\\s*Code:?\\s*137)"
    expect_sources: [kubernetes]

  - q: "上一次发布顺手把副本数从 3 调到 10，现在执行 kubectl rollout undo，副本数会跟着回到 3 吗"
    expect_keypoints:
      # 结论：不会，回滚只覆盖 Pod template。
      - "(?i)((只|仅)[^。；\\n]{0,12}(回滚|恢复|还原)[^。；\\n]{0,12}(Pod\\s*)?(template|模板)|(副本数|replicas)[^。；\\n]{0,12}(不会|不(受影响|变|回))[^。；\\n]{0,8}(回滚|改变|变回)?)"
      # 依据：扩缩容不产生新的 revision。
      - "(?i)((扩缩容|伸缩|scal(e|ing)|改副本数|调整副本)[^。；\\n]{0,20}(不(会)?(产生|创建|生成)|不算)[^。；\\n]{0,10}(新的?)?(revision|修订|版本记录)|(revision|修订版本)[^。；\\n]{0,24}(只|仅)[^。；\\n]{0,12}(template|模板)(改变|变化|变更)?)"
    forbid_patterns:
      # 结论反转：说副本数会一起回滚。
      # 收紧（本轮实测）：这题的本地答案正是这条 pattern 要抓的反转
      # （"是，执行 `kubectl rollout undo` 会将副本数恢复到上一版本的配置值
      # （即 3）"），但原写法第二个分支要求"恢复**回**"，实际文本是
      # "恢复**到**"，没打中——一条抓不住自己动机例句的负向约束等于没有
      # （AGENTS.md §5.3）。改成 (恢复|变|改|回)(回|到|成)。这题本轮因两条
      # 关键点全未命中已判 failed，收紧不改变本轮结论。
      - "(?i)((副本数|replicas)[^。；\\n]{0,14}(?<!不)(会|将|也)[^。；\\n]{0,8}(一起|跟着|同时)?[^。；\\n]{0,6}(回(滚|到)|恢复(到|成)|变回)|(回滚|undo)[^。；\\n]{0,12}(会|将)[^。；\\n]{0,10}(把)?[^。；\\n]{0,10}(副本数|replicas)[^。；\\n]{0,10}(恢复|变|改|回)(回|到|成))"
    expect_sources: [kubernetes]

  - q: "为了让 kubectl get rs 干净点，把 revisionHistoryLimit 设成 0，会有什么后果"
    expect_keypoints:
      # 后果：这个 Deployment 从此没法回滚。
      # 校准（本轮实测）：本地答案写的是"会导致失去回滚能力，新 Deployment
      # 无法回退到之前的版本"——两处都命中不了原正则："失去"在"回滚"之前，
      # 且用的是"回退"而不是"回滚"。补同义词与语序，与 R60 给 Q22 补"估算"
      # 是同一类正则过窄修正。
      - "(?i)((无法|不能|没法|不再能)[^。；\\n]{0,12}(回滚|回退)|(失去|丧失|没有了)[^。；\\n]{0,8}(回滚|回退)|(回滚|回退)[^。；\\n]{0,10}(能力)?[^。；\\n]{0,6}(丢失|没有了|失效))"
      # 依据：历史就存在旧的 ReplicaSet 里，删了就没了（默认保留 10 个）。
      - "(?i)((旧的?|历史)[^。；\\n]{0,10}ReplicaSet|ReplicaSet[^。；\\n]{0,16}(保存|存(放|着)|保留)[^。；\\n]{0,10}(历史|revision)|默认[^。；\\n]{0,12}(保留|是)\\s*10)"
    expect_sources: [kubernetes]

  # ---- 第六张卡片：订单/对账对不上（knowledge/scenarios/order-reconciliation-mismatch.md）----
  #
  # 出题方式与前五批相同：先按卡片的 9 个小节各挑一条"排查时真会被问到、
  # 且卡片正文确实写了"的事实，再写成中文问法；判据按 CR-066/067 的两个
  # 通道出（绑定式正向关键点 + 是非/选择题必配 forbid_patterns）。
  # 本批 11 题里有 5 道被 `_is_yes_no_question` 判为有结论方向
  # （Q38/Q40/Q42/Q44/Q46），全部配了负向约束。
  #
  # 前八题的出处是 spring-framework（T-114 新增来源，只取 data-access/），
  # 后两题是 postgresql；卡片小节本身落库后 source_project 即为被引用来源，
  # 因此 expect_sources 写被引用来源而不是 "scenario-cards"。

  - q: "下单方法抛了自定义的受检异常，前面那步写库为什么没有跟着回滚"
    expect_keypoints:
      # 绑定式：受检异常必须和"不回滚"这个结论连在一起说。
      - "(?i)((受检|检查型|checked)\\s*(异常|exception)[^。；\\n]{0,20}(不(会)?(触发|导致|引发)?[^。；\\n]{0,6}回滚|不回滚|照(常|样)提交|仍(然)?提交)|(不(会)?回滚|不触发回滚)[^。；\\n]{0,20}(受检|checked))"
      # 依据：默认只对 RuntimeException / unchecked 回滚。
      - "(?i)((默认|default)[^。；\\n]{0,24}(RuntimeException|unchecked|运行时异常|非受检)|(RuntimeException|unchecked|运行时异常|非受检)[^。；\\n]{0,20}(才|方|只有|默认)[^。；\\n]{0,10}回滚)"
    expect_sources: [spring-framework]

  - q: "在 @Transactional 方法里把异常 catch 住只记日志，事务还会不会回滚"
    expect_keypoints:
      # 结论：不会——异常没有冒泡出去，事务基础设施看不到它。
      - "(?i)((不会|不再|不)[^。；\\n]{0,8}回滚|照(常|样)提交|仍(会|然)?[^。；\\n]{0,4}提交)"
      # 补救手段：重新抛出运行时异常，或显式 setRollbackOnly。
      - "(?i)(setRollbackOnly|(重新|再)?(抛出|throw)[^。；\\n]{0,16}(RuntimeException|运行时异常|异常)|rollbackFor)"
    forbid_patterns:
      # 结论反转："catch 了也还是会回滚"。
      # 校准（本轮实测）：第一版第二个分支写成 `事务[^。；\\n]{0,8}(?<!不)(会|将)[^。；\\n]{0,6}回滚`，
      # 被真实答案"事务将不会回滚"命中——(?<!不) 只挡住了"将"前面的否定，
      # 而否定词落在"将"和"回滚"之间的间隔里照样匹配。改成把否定词从**间隔
      # 字符类**里排除（`[^。；\\n不未没]`），这是 CR-067 那类逆序断言在
      # "否定词在中间"时的正确写法。
      - "(?i)((?<!不)(?<!没)(会|仍然会|依然会|还是会)[^。；\\n不未没]{0,10}(自动)?[^。；\\n不未没]{0,4}回滚|事务[^。；\\n不未没]{0,8}(会|将)[^。；\\n不未没]{0,6}回滚)"
    expect_sources: [spring-framework]

  - q: "想让某个受检异常也触发回滚该怎么配，用异常类名的字符串匹配有什么坑"
    expect_keypoints:
      # 绑定式：配置项名字必须出现（rollbackFor / rollback-for）。
      - "(?i)(rollbackFor|rollback-for|rollbackForClassName)"
      # 坑：模式是**子串**匹配，会误伤同前缀/嵌套类；写 "Exception" 几乎匹配一切。
      - "(?i)((子串|substring|包含|前缀)[^。；\\n]{0,24}(匹配|match)|CustomExceptionV2|(嵌套类|nested\\s*class)|\"?Exception\"?[^。；\\n]{0,20}(匹配|match)[^。；\\n]{0,16}(几乎|所有|一切|nearly anything))"
    expect_sources: [spring-framework]

  # CR-089（codex R78 审查）：这题原来问的是"writeLedger 上的 @Transactional
  # 生不生效"，与卡片小节原标题"完全没有事务"一起，把**两种不同的局面**
  # 合并成了一个结论：内层注解不经代理生效 ≠ 内层代码完全不在事务里。外层
  # placeOrder 自己开了事务时，内层写操作**仍然在那个外层事务里**，只是它
  # 自己声明的边界（REQUIRES_NEW、隔离级别、超时）不作数。卡片正文第 47-49 行
  # 本来就写对了（"whatever transaction (possibly none) the caller had"），
  # 是标题和题目把它说过了头。
  #
  # 处理：题目收窄成"会不会新开一个事务"，两条关键点分别绑定"不会新开"与
  # "仍在外层事务里"；负向约束除了抓"会新开事务"这个反转，**另抓"完全没有
  # 事务"**——那正是 CR-089 指出的那种被诱导出来的错误答案。与下一题（外层
  # 没有事务的情形）成对，两题合起来才把"无内层边界"与"完全无事务"分开。
  - q: "外层 placeOrder 已经标了 @Transactional，它直接调用本类的 writeLedger（写着 @Transactional(REQUIRES_NEW)），writeLedger 里的写操作会不会跑在一个新事务里"
    expect_keypoints:
      # 结论一：不会新开事务——自调用不经过代理，内层注解不作数。
      - "(?i)((不(会)?[^。；\\n]{0,6}(新开|另开|开启|创建|启动)[^。；\\n]{0,6}(一个)?[^。；\\n]{0,4}(新的?)?事务)|((REQUIRES_NEW|注解)[^。；\\n不未没]{0,16}(不生效|无效|失效|不起作用|被忽略))|((自调用|内部调用|同一个?类[^。；\\n]{0,10}(内部)?调用)[^。；\\n]{0,26}(不(会)?(生效|经过|走|被拦截)|无效|失效)))"
      # 结论二：它仍然跑在外层那个事务里（这一条正是 CR-089 要求保留的分支）。
      # 校准（本轮实测）：第二个分支第一版写成
      # `(外层|调用方)…事务[^。；\\n]{0,12}(里|中|内|继续|生效)`，被那次**结论
      # 完全相反**的答案命中了——"若外层事务已提交或回滚，内层事务不受影响"
      # 里的"内"其实是"内层"的第一个字，而间隔类允许跨过逗号。一条能被
      # 反转答案命中的正向关键点比没有更糟。改成：间隔不得跨逗号，方位词
      # 后面用 `(?![层部内外])` 排除"内层/内部"这类词的首字。
      - "(?i)((仍然?|还是|依然|继续|依旧)[^。；\\n，,]{0,10}(在|使用|复用|沿用|加入|参与)[^。；\\n，,]{0,10}(外层|placeOrder|调用方|原来的?|同一个?)[^。；\\n，,]{0,8}事务|(外层|调用方)[^。；\\n，,]{0,6}(的)?事务[^。；\\n，,]{0,8}(里|中|内)(?![层部内外])|(加入|参与|复用|沿用)[^。；\\n，,]{0,6}(外层|调用方|已有|既有)[^。；\\n，,]{0,6}事务)"
    forbid_patterns:
      # 反转一：说会新开一个事务（REQUIRES_NEW 照常生效）。
      # 反转二（CR-089 点名的那种）：说内层写操作完全不在任何事务里——外层
      # 已经开了事务，这个结论是错的，且危害更大（会让人以为数据没被保护）。
      # 否定词一律从间隔类里排除，正确答案里的"不会新开事务""没有新事务"
      # 不受影响。
      - "(?i)((?<!不)(会|将|则)[^。；\\n不未没]{0,8}(新开|另开|开启|创建|启动)[^。；\\n不未没]{0,6}(一个)?[^。；\\n不未没]{0,4}新[^。；\\n不未没]{0,2}事务|REQUIRES_NEW[^。；\\n不未没]{0,12}(会|将|照样|仍然)[^。；\\n不未没]{0,6}(生效|起作用|新开)|(完全|根本|压根)[^。；\\n]{0,6}(没有|不在|不处于)[^。；\\n]{0,6}(任何)?[^。；\\n]{0,4}事务|(写操作|内层|writeLedger)[^。；\\n]{0,12}(不在|没有)[^。；\\n]{0,6}(任何)?[^。；\\n]{0,4}事务(里|中|内)?)"
    expect_sources: [spring-framework]

  # CR-089 要求的"能区分无内层边界与完全无事务"的另一半：外层**没有**事务时，
  # 结论也只到"这个注解没有建立它声明的边界"为止。
  #
  # CR-091（codex R80 审查）把这一题又收窄了一次，**理由是上一版仍在外推**：
  # 原问法问"还能保住这次写库吗"、正向关键点收"没有任何事务/不会回滚"，
  # 而 Spring 的自调用规则只断言**被自调用的那个注解**不会产生它声明的边界，
  # 管不着后面发生什么——`writeLedger()` 接着调用**另一个 bean**（比如
  # Spring Data 的 repository）时，那次调用是经过**那个 bean 的代理**进去的，
  # 下游完全可以在那里建立自己的事务边界；程序式事务（`TransactionTemplate`）
  # 同理。所以"整条链路没有事务、没人回滚"是这条规则给不出的结论。
  #
  # 这是同一处地方的第三次外推，三次方向各不相同（外层有事务时说成"完全没
  # 事务"、外层无事务时说成"会自行提交"、现在是说成"后面也不会有事务"）。
  # 现在的问法只问**这个注解本身会不会建立它声明的边界**，正向关键点绑定
  # "不会建立/不生效"与代理机制，不再有任何关于后续结果的断言。
  - q: "外层 placeOrder 没标 @Transactional 时，本类自调用的 writeLedger 上那个 @Transactional 还会不会建立它声明的事务边界"
    expect_keypoints:
      # 结论：不会——这个注解在这次调用上不作数。
      # 校准（本轮实测）：真实答案写的是"`@Transactional` **无法生效**"，
      # 而第一版的终结词表只有"不生效/无效/…"，且前面的间隔类把"无"排除了
      # （那是 CR-090 为挡"无法回滚"加的），于是"无法生效"两头不沾、判成未命中。
      # 把"无法生效/不能生效/未生效/没有生效"补进终结词表——它们和"不生效"
      # 是同一件事，不是放宽结论。补完之后这题仍是 failed（机制关键点未命中：
      # 答案把原因说成"没配 @EnableTransactionManagement"，不是自调用绕过代理），
      # 即这次校准没有把一个答错的回答变绿。
      - "(?i)((不(会)?[^。；\\n]{0,6}(建立|创建|开启|产生|生成)[^。；\\n]{0,8}(事务)?[^。；\\n]{0,4}(边界|事务))|((注解|@Transactional|REQUIRES_NEW)[^。；\\n不未没无]{0,16}(不生效|无法生效|不能生效|未生效|没有生效|无效|失效|不起作用|没起作用|没有起作用|被忽略|不作数))|((自调用|内部调用|同一个?类[^。；\\n]{0,10}(内部)?调用|this\\.)[^。；\\n]{0,26}(不(会)?(生效|经过|走|被拦截)|无效|失效)))"
      # 依据：机制必须说出来——要么"代理只拦经过代理进来的外部调用"，要么
      # "这次自调用没有经过代理"。**第二种写法是校准补的**：CR-091 点名要求
      # "既说明自调用注解失效、又说明下游 repository/TransactionTemplate 仍可
      # 另建事务"的回答必须通过，而那种回答的机制句正是"自调用不经过代理"，
      # 第一版只认"代理…拦截外部调用"这一种措辞，会把它判成未命中。
      - "(?i)((代理|proxy)[^。；\\n]{0,26}(外部调用|external|拦截|intercept)|(外部调用|external\\s*method)[^。；\\n]{0,20}(代理|proxy|拦截)|(自调用|内部调用|同一个?类[^。；\\n]{0,10}(内部)?调用|this\\.)[^。；\\n]{0,14}(不经过|没经过|没有经过|不走|绕过|不通过)[^。；\\n]{0,6}(代理|proxy))"
    forbid_patterns:
      # 反转一：说这个注解照样生效、照样建立边界。
      - "(?i)((注解|@Transactional|REQUIRES_NEW)[^。；\\n不未没无]{0,12}(会|将|仍然|依然|照样)[^。；\\n不未没无]{0,6}(生效|起作用|建立|创建|开启)|(仍然|依然|照样|还是)[^。；\\n不未没无]{0,6}(会|能)?[^。；\\n不未没无]{0,4}(建立|创建|开启)[^。；\\n不未没无]{0,6}事务)"
      # CR-090：无证据的持久化断言（"会自动提交/直接落库"）。
      #
      # **范围已冻结（codex R84 裁定，2026-09-13）**。同一批意见删掉了本题
      # 第三条约束（CR-095），而那条的删除理由"零真实命中 + 样例全手写"
      # 逐字适用于这一条，区别只是它至今没造成误伤。裁定是**保留但冻结**：
      #   - 语义**仅**为"当前证据不足以支撑具体持久化结果，请人工复核"，
      #     **不表示"自动提交必错"**（纯 JDBC 自动提交下它可能是对的）；
      #   - 在有**保存下来的真实生成样本**之前，**不得扩展触发词或正则**，
      #     包括"看起来只是补一个同义词"这种改动。要扩，先拿出那条真实输出。
      # 以上是裁定要点，不是我的复述式收紧；改动它需要审查方复核。
      - "(?i)((自动|自行|直接|照常|正常)[^。；\\n不未没无]{0,6}(提交|落库|落盘|写入成功|commit)|(写库|写入|数据|这条记录|这次写)[^。；\\n不未没无]{0,10}(会|将|已经|仍然)[^。；\\n不未没无]{0,6}(提交|落库|落盘|保存下来)|auto.?commit[^。；\\n不未没无]{0,10}(提交|生效))"
      # **CR-095（codex R83 裁定）：这里原来还有第三条负向约束，已删除。**
      # 它抓的是"把这个注解不建边界外推成整条调用链都没有事务/没人回滚"。
      # 删除理由（裁定原文的要点）：三轮里**没有任何一次真实生成命中过它**，
      # 三次样例全是手写或审查方的复现输入；与此同时它连续造成两次**正确
      # 回答误伤**（CR-092 的"这个注解根本没有建立事务边界"、CR-094 的
      # "下游可有事务，注解没有建立事务边界"），而 R83 的收紧又有意放过了
      # 跨分句的真外推（"整条调用链，都没有事务"不再命中）——真实信号不足以
      # 抵消人工复核噪声与维护成本。
      #
      # **被删掉的那条约束长这样**（留档，便于日后重建时对照）：
      #   (写操作|写入|写库|…|下游)…(完全|根本|压根|都)?…(没有|不存在|不在|不会有)…事务
      #   | (没有|不存在)…(任何)…(东西|人|地方|代码)?…(会)?…回滚
      #   | (一定|必然|肯定|绝对)…不会回滚
      #
      # **重建条件**（不是"以后再说"，是明确的触发条件）：出现**保存下来的
      # 真实输出**，证明这种外推确实发生过、并且逃过了上面两条正向关键点；
      # 届时以那份真实样本重新提出判据，而不是再凭手写样例调正则。
      # 在那之前，这一类错误由**正向关键点 + 卡片正文的事实审查**承担——
      # 三次真实的外推（CR-089/090/091）都发生在卡片正文里、由审查方读出来，
      # 本来就不是这条约束发现的。
    expect_sources: [spring-framework]

  - q: "内层方法的异常已经被外层 catch 掉了，为什么外层提交时还抛 UnexpectedRollbackException"
    expect_keypoints:
      # 绑定式：异常名 + 它表示的事实（内层已经把事务标记成只能回滚）。
      - "(?i)UnexpectedRollbackException"
      - "(?i)((rollback.?only|只能回滚|仅回滚|回滚标记)[^。；\\n]{0,26}(内层|inner|子方法)?|内层[^。；\\n]{0,24}(标记|标(成|为))[^。；\\n]{0,14}(回滚|rollback))"
    expect_sources: [spring-framework]

  - q: "对账方法上标了 readOnly 和隔离级别，被上层事务调用进来时这些设置还生不生效"
    expect_keypoints:
      # 结论：参与既有事务时，本地的隔离级别/超时/只读被静默忽略。
      - "(?i)((忽略|不生效|失效|无效|被覆盖|沿用外层|继承外层)[^。；\\n]{0,26}(隔离级别|isolation|只读|read.?only|超时|timeout)|(隔离级别|只读|read.?only|超时)[^。；\\n]{0,26}(被)?(忽略|不生效|失效|无效|沿用|继承))"
      # 绑定式：机制是"参与外层的同一个（物理）事务"。
      - "(?i)((参与|加入|沿用|复用|继承)[^。；\\n]{0,16}(外层|已有|既有|现有|outer)[^。；\\n]{0,10}事务|同一个?(物理)?事务|REQUIRED)"
    forbid_patterns:
      # 结论反转："标了就一定按你标的来"。
      - "(?i)((?<!不)(会|都)[^。；\\n]{0,8}(按|以)[^。；\\n]{0,14}(自己|本方法|注解)[^。；\\n]{0,10}(的)?(隔离级别|只读|设置)[^。；\\n]{0,8}(生效|执行)|(隔离级别|只读|read.?only)[^。；\\n]{0,12}(?<!不)(会|仍然|依然|照样)[^。；\\n]{0,6}生效)"
    expect_sources: [spring-framework]

  - q: "对账任务想把失败明细单独落库、不受主事务回滚影响，该用哪种传播行为，代价是什么"
    expect_keypoints:
      - "(?i)(REQUIRES_NEW|requires.?new)"
      # 代价：另占一条数据库连接，连接池不够会死锁。
      - "(?i)((连接池|connection pool|数据库连接)[^。；\\n]{0,26}(耗尽|不足|占用|死锁|deadlock)|(死锁|耗尽)[^。；\\n]{0,20}(连接池|连接))"
    expect_sources: [spring-framework]

  - q: "REQUIRES_NEW 和 NESTED 有什么不同，审计记录要在主事务回滚之后仍然留得下来该选哪个"
    expect_keypoints:
      # 绑定式：NESTED 是同一个物理事务里的保存点。
      - "(?i)((NESTED|嵌套)[^。；\\n]{0,26}(保存点|savepoint)|(保存点|savepoint)[^。；\\n]{0,20}(NESTED|嵌套))"
      # 结论：要留得下来就得用 REQUIRES_NEW（独立事务，独立提交）。
      - "(?i)(REQUIRES_NEW[^。；\\n]{0,30}(独立|单独|自己的)[^。；\\n]{0,16}(事务|提交|commit)|(独立|单独)[^。；\\n]{0,12}(物理)?事务[^。；\\n]{0,20}REQUIRES_NEW)"
    forbid_patterns:
      # 结论反转：说 NESTED 的内层提交能在外层回滚后留下来（那是 REQUIRES_NEW）。
      - "(?i)((NESTED|嵌套事务)[^。；\\n]{0,30}(?<!不)(会|能|可以)[^。；\\n]{0,14}(独立提交|单独提交|保留下来|留下来|不受[^。；\\n]{0,8}影响)|(审计|明细|记录)[^。；\\n]{0,12}(用|选|应该用)[^。；\\n]{0,6}NESTED)"
    expect_sources: [spring-framework]

  # 出题缺陷，改了**两次**，两次的性质不同，都保留记录（沿用 R60 改 Q19、
  # R71 改 Q29 的处理）：
  #
  # 第一版"下单成功后要发一条 Kafka 消息，怎么保证事务回滚时这条消息不会
  # 已经发出去"——全句唯一的技术锚点是 Kafka，检索整段落到 Kafka 事务型
  # producer 上，引用里一条 spring-framework 都没有。
  #
  # 第二版补了"Spring 的 @Transactional 方法里"这个锚点，**仍然不对**：
  # 实测答案给的是"外层 DataSourceTransactionManager + 内层
  # KafkaTransactionManager"，检索第 1/4/6 名都是 spring-kafka 的
  # 「Examples of Kafka Transactions with Other Transaction Managers」——
  # 那是这个问题的**另一个正确答案**，而且是 spring-kafka 官方推荐的做法。
  # 问题是开放的（"该怎么改"），判据却只认事件监听器这一种解法，等于用
  # 判据去否定一个正确答案（AGENTS.md §5.3：判据不得承诺它没测量的东西）。
  #
  # 第三版把问题收到卡片这一小节真正独有的事实上：**绑定到提交这个时点**、
  # 以及**没有事务在跑时会怎样**。后者是同一小节的另一条事实，因此第二条
  # 关键点不再是"把问题里的词抄回来"。
  - q: "订单落库的事务提交成功之后才想触发后续动作，Spring 有什么现成机制能绑到这个时点上，没有事务在跑时它会怎样"
    expect_keypoints:
      - "(?i)(TransactionalEventListener|AFTER_COMMIT)"
      # 绑定式：没有事务在跑时监听器**根本不执行**（除非 fallbackExecution）。
      - "(?i)(fallbackExecution|(没有|无|不存在|未开启)[^。；\\n]{0,10}事务[^。；\\n]{0,20}(不(会)?[^。；\\n]{0,4}(触发|调用|执行|invoke)|不执行)|(不(会)?[^。；\\n]{0,4}(触发|调用|执行))[^。；\\n]{0,16}(没有|无)[^。；\\n]{0,6}事务)"
    expect_sources: [spring-framework]

  - q: "对账任务在一个事务里先统计订单再统计支付，默认隔离级别下这两次查询看到的数据是不是一致的"
    expect_keypoints:
      # 结论：默认 Read Committed 下每条语句各自取快照，两次可能不一致。
      - "(?i)((read\\s*committed|读已提交)[^。；\\n]{0,30}(每(条|个)?语句|每次查询|语句级|statement)|(每(条|个)?语句|每次查询|语句级)[^。；\\n]{0,26}(快照|snapshot))"
      - "(?i)((不一致|可能不同|看到不同|会变|不同的数据)|(repeatable\\s*read|可重复读)[^。；\\n]{0,26}(事务级|整个事务|同一个?快照))"
    forbid_patterns:
      # 结论反转："同一个事务里两次查询一定一致"（那是 Repeatable Read 才有的保证）。
      - "(?i)((同一个?事务|一个事务)[^。；\\n]{0,16}(?<!不)(会|一定|必然|总是)[^。；\\n]{0,10}(一致|相同|一样)|两次(查询|统计)[^。；\\n]{0,12}(?<!不)(一定|必然|总是|肯定)[^。；\\n]{0,8}(一致|相同))"
    expect_sources: [postgresql]

  - q: "对账作业报 could not serialize access due to concurrent update，SQLSTATE 40001，该怎么处理"
    expect_keypoints:
      # 结论：应用自己重试，而且重试的**单位是事务**（不是重发那条语句）。
      # 校准（本轮实测）：第一版要求逐字出现"整个/完整/全部"，而真实答案写的是
      # "对涉及 UPDATE/DELETE… 的事务进行重试"——它说的正是"以事务为单位重试"
      # 这件事。放开限定词，但保留绑定：重试必须与"事务"相邻出现，答成
      # "重试这条 SQL"仍然不命中。
      - "(?i)((重试|retry)[^。；\\n]{0,12}(整个|完整|全部)?[^。；\\n]{0,8}事务|(整个|完整)?[^。；\\n]{0,8}事务[^。；\\n]{0,10}(进行)?[^。；\\n]{0,4}(重试|retry))"
      # 依据：数据库不会替你自动重试。
      - "(?i)((不(会|提供|支持))[^。；\\n]{0,20}(自动)?[^。；\\n]{0,8}重试|(自动重试)[^。；\\n]{0,16}(不|没有|无法)|40001|serialization_failure)"
    expect_sources: [postgresql]
