# I2 / T-023 基础回归集。中文题面保留自 version 1；英文题面是人工撰写，
# 运行器只读取 q_zh/q_en，绝不在运行时翻译。每条应作答题用同一组中英
# 正则断言一个具体事实，并要求引用指定的官方项目来源。
version: 2

questions:
  # ---- Kafka ----
  - id: kafka-duplicate-consumption
    q_zh: "Kafka 消费者重复消费怎么排查"
    q_en: "How should I investigate duplicate consumption by a Kafka consumer?"
    expect: answered
    expect_keypoints: ["(?i)(auto.?commit|手动提交|manual commit)"]
    expect_sources: [kafka]
  - id: kafka-offset-commit
    q_zh: "Kafka 的 offset 是怎么提交的"
    q_en: "How are Kafka consumer offsets committed?"
    expect: answered
    expect_keypoints: ["(?i)(commit|提交).{0,30}(offset|位移)|(offset|位移).{0,30}(commit|提交)"]
    expect_sources: [kafka]
  - id: kafka-rebalance
    q_zh: "Kafka 消费者组重平衡会发生什么"
    q_en: "What happens when a Kafka consumer group rebalances?"
