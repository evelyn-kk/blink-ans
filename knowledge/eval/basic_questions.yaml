    expect_keypoints: ["(?i)(rebalanc|重平衡).{0,40}(partition|分区)|(partition|分区).{0,40}(rebalanc|重平衡)"]
    expect_sources: [kafka]
  - id: kafka-transactional-producer
    q_zh: "Kafka 事务型生产者怎么保证精确一次"
