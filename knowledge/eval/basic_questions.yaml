    expect_keypoints: ["(?i)(transaction|事务).{0,40}(exactly.?once|精确一次|恰好一次)|(exactly.?once|精确一次|恰好一次).{0,40}(transaction|事务)"]
    expect_sources: [kafka]
  - id: kafka-idempotent-producer
