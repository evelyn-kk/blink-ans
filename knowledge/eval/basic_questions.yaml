# I2 基础题回归集
#
# 完成定义（plan.md I2）：50 道基础题可得到可访问的来源链接；
# 无来源的技术结论不会伪装为确定答案。
#
# 因此题目分两类：
#   expect: answered     —— 语料应当覆盖，须返回来源且答案带引用标注
#   expect: refused      —— 语料不覆盖，须判为证据不足，不得给出确定的技术结论
#
# 这不是 I3 的场景评测集：这里只验证管线可用与引用可追溯，
# 不评判答案的技术正确性。I3 的 100 道场景题才做正确性评分。

