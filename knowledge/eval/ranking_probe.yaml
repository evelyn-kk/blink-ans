# 检索排序探针 —— 只读，秒级，不跑 LLM
#
# 存在的理由（T-017）：一次 50 题 LLM 回归要 8–10 分钟，无法用来扫参数。
# 而 44 题「来源护栏」只断言 top5 里有没有期望**来源**，粒度太粗——
# 「来源对但块不对」它抓不到（CR-013 自陈的薄弱点之二）。
# 因此这里断言到**块**：每题指定一段人工核对过的正确小节，只测它的名次。
#
# 金标准怎么定（T-017 三次翻车换来的规矩）：
#   - 不得用 `text LIKE '%关键词%'` 圈定正确块——那会把上百块全算对，指标失效。
#   - 不得用「标题里有这个词」——`Increasing replication factor` 讲的是怎么加副本数，
#     而问题问的是 ISR 机制，正确的是 `Design › Replication`。
#   - 每条 gold 必须人工打开读过正文，确认它真的回答了这个问题。
#
# gold 用 title_path 前缀而非块 id：块 id 每次重建索引都会变，
# title_path 是人可读、跨重建稳定的小节路径。
#
# 用法: .venv/bin/python packages/evaltools/probe_ranking.py

version: 1

# top_k：正确块必须进入前几名才算通过。5 对齐 AnswerConfig.max_evidence。
top_k: 5

# baseline 的维护规则（CR-015）：
#   - 它记录**上次验收通过时**的名次，改动被接受后要就地更新，否则门禁会逐渐失真。
#   - `null` 只用于「从未测过」，**不要**用它表示「当前没进候选」——
#     退步判据会跳过 baseline 为 null 的题，等于给它开了个后门。
#   - 门禁有两条：比基线更差算退步；非 known_open 却没进 top_k 算未达标。两者都会让命令失败。

probes:
  # ---- CR-013 直接针对的两道（T-025 新增）----
  - q: PostgreSQL 索引失效
    project: postgresql
    gold: "Indices › Indexes › Examining Index Usage"
    baseline: 1             # T-025 修复前未进候选（关键词路第 109 名），修复后第 1 名
    note: PG 官方讲「索引为什么没被用上」的正是这一节

  - q: PostgreSQL 的 B-tree 索引什么时候会失效
    project: postgresql
    gold: "Indices › Indexes › Examining Index Usage"
    baseline: 1             # T-025 修复前未进候选，修复后第 1 名
    note: |
      同一概念，中间插了「什么时候会」。T-017 记录把它判为「语料没有覆盖」，
      T-025 实测推翻：覆盖存在，是通用词映射把纯噪声送进 OR 查询导致的排序问题。
      注意：检索到第 1 名≠端到端能作答——模型仍拒答，成因见 T-030。

  - q: Spring Boot 配置优先级是怎样的
    project: spring-boot
    gold: "External Config › Externalized Configuration"
    baseline: 1
    note: 属性源的完整优先级列表就在这一节正文里（`优先级` 是本轮改动的另一条通用映射）

  # ---- 护栏：本轮改动不得让它们退步 ----
  - q: Kafka 消费者重复消费怎么排查
    project: kafka
    gold: "Design › Message Delivery Semantics"
    baseline: 7
    known_open: true
    note: |
      讲至少一次/精确一次投递语义的是 Design 这节，不是各处的配置提及。
      **既有缺口，非 T-025 引入**：top5 里第 4 名是 `rocksdb.config.setter`——
      progress.md「已知但尚未立项的质量问题」记的就是它，本探针第一次把它量化了。
      2026-09-06（T-018/CR-040）：新增 spring-kafka 后一度由 6 名退到 10 名，
      当时的处理记录误判为"语料扩大的正常副作用"（codex R35 审查指出证据不足，
      见 CR-040）。反事实实验实测：把 `current.db` 复制一份、只把
      `source_project='spring-kafka'` 的行的 `technology` 手工改成一个独立
      值后重放同一查询，向量路排名从"未进候选"恢复到 22（与新增来源之前的
      旧索引一致），RRF 名次从 10 回到 7。根因**不是** bm25 idf 漂移，而是
      `services/retrieval/search.vector_search()` 的生产实现先在全局 vec0
      做 KNN（`limit*4=120` 条，不分技术域）、再按 `technology` 过滤——
      spring-kafka 与 kafka 共用 `technology=kafka` 标签时，实测占满未过滤
      前 120 个坑位中的 64 个（原本 kafka 占 111 个），把 gold 块直接挤出
      120 个候选之外。已改为给 spring-kafka 单独的 `technology` 值（见
      `knowledge/sources.yaml`），本条基线相应更新为实测的 7（较改动前的
      基线 6 仍有 1 名的残留 bm25 idf 级漂移，判定为可接受的语料规模副作用，
      机制已通过同一反事实实验交叉验证）。

  - q: Kafka 分区副本的同步机制是什么
    project: kafka
    gold: "Design › Replication"
    baseline: 1
    note: 问的是 ISR 机制；`Increasing replication factor` 讲的是怎么加副本数，不算对

  - q: Kubernetes liveness probe 配置参数有哪些
    project: kubernetes
    gold: "Liveness, Readiness, and Startup Probes › Configuration fields"
    baseline: 12
    known_open: true
    note: |
      探针字段（periodSeconds / failureThreshold 等）集中在这一节。
      **既有缺口，非 T-025 引入**：该提问不含任何 term_map 键，展开为空，
      纯靠 `liveness`/`probe` 两个词竞争 200 多个含探针的 K8s 块。
      2026-09-06（T-018/CR-040）：曾记为"新增 spring-kafka/debezium 后由
      11 名退到 12 名，因 bm25 全表 idf 漂移"——**这个归因是错的**，已被
      codex R35 审查指出证据不足（CR-040）并经反事实实验证伪：直接用
      T-018 之前的备份索引 `data/index/current.previous.db`（13496 块，
      不含 spring-kafka/debezium）与合入后的 `current.db`（14581 块）跑
      完全相同的 query 向量，关键词路（14）、向量路（20）、RRF（12）三项
      名次在两个索引上逐位完全相同，新来源对这条查询的候选池零介入
      （全局未过滤 KNN top120 的来源分布两边都是 115 kubernetes + 5
      spring-boot）。说明基线从 11 变成 12 发生在 T-018 之前的某次未知
      改动，且从未被重新核对过——本轮只是如实把陈旧基线更正为当前实测值，
      不代表 T-018 造成了任何退步。真正原因留待触碰 K8s 检索或排序时再查。

  # ---- CR-039：T-018 新增来源必须有生产混合检索金标准探针，不能只靠关键词路对照 ----
  - q: Debezium Outbox 表要包含哪些字段才能保证事件和业务数据一致
    project: debezium
    gold: "Outbox Event Router › Basic outbox table"
    baseline: 9
    known_open: true
    note: |
      2026-09-06（CR-039）：人工打开 `outbox-event-router.adoc` 源文件确认
      该小节正文是 Outbox 表的标准列定义（id/aggregatetype/aggregateid/
      type/payload 及各列语义），直接回答本题。判别性验证：把
      `source_project IN ('spring-kafka','debezium')` 的行从 `current.db`
      复制一份删除后，生产 `hybrid_search()`（technology='debezium'，与
      `detect_technology()` 对这句话的判定一致）对同一查询返回 `rank=None`
      （候选池为空）；在含新来源的真实索引上为第 9 名——证明这确实是因为
      "有没有这批新入库的内容"，不是探针本身的编号误差。top5 全部是同一
      Outbox Event Router 页面下的其他小节（payload 序列化、示例消息、
      附加字段），均是该问题的合理旁证但不是最直接答案，故未进前 5，如实
      记为 known_open：新语料"存在且大方向可召回"，但离"精确定位到最对的
      那一节"还有差距，留待 T-007 写场景卡片、或后续排序调优时改进。

  - q: Spring Kafka 消费失败怎么配置重试和死信队列
    project: spring-kafka
    gold: "Retry Config › Configuration › Using the `@RetryableTopic` annotation"
    baseline: 6
    known_open: true
    note: |
      2026-09-06（CR-039）：人工打开 `retrytopic/retry-config.adoc` 源文件
      确认该小节正文是"给 `@KafkaListener` 方法加 `@RetryableTopic` 注解即可
      自动搭建重试与死信主题"——对这个问题最直接、最常规的回答。
      2026-09-06（CR-041，处理 codex R36 复审意见）：R36 指出上一版基线
      （20）的成因——`detect_technology()` 对同时出现"spring"与"kafka"的
      问题判定为跨技术域放弃过滤——不该留到下一轮，因为它本身就是本任务
      "让 Spring Kafka 场景可检索"的核心目标没达成。已处理：
      1) `detect_technology()` 新增组合判定，"spring"+"kafka"同时出现
         （且没有第三个技术域词）时直接判定为 `spring-kafka` 单一技术域，
         不再退化为不加过滤的全库检索。
      2) `services/retrieval/search.py` 新增 `TECHNOLOGY_GROUPS`：
         `kafka`/`spring-kafka` 视为一组，检索时两个技术域各自独立跑一遍
         关键词/向量检索（各自拿公平的候选名额，不共用同一次 SQL 过滤），
         再按主/副权重（1.0 / 0.4）用 RRF 合并——主技术域权重更高，避免
         重演 CR-040 那种"副技术域挤占主技术域候选"的退步。
      本题按新逻辑排到第 6 名（此前 7 名），判别性验证：删除
      `source_project IN ('spring-kafka','debezium')` 的对照索引上仍为
      `rank=None`。同组的两条 Kafka broker 协议探针（"消费者重复消费怎么
      排查"“分区副本的同步机制”）分别保持第 7、第 1 名，不受影响——权重
      取值 0.4 是在这两类问题之间实测扫描 [0.4, 0.6, 0.7, 0.8, 1.0] 选出的，
      过程记录见 `development-notes.md`。
      2026-09-06（T-007 第二张卡片，`kafka-consumer-retry-dlq.md`）：本题
      正是这张卡片要覆盖的场景，新增 5 条 authored 块后金标准名次
      6 → 7。**CR-048（codex R44 审查）指出这里最初把 baseline 同步改成 7
      是错误处理**：`known_open` 不是退步豁免，把 baseline 改成实测的
      退步后数值会让门禁永久失去对这次真实退步的信号，等同一个"豁免
      后门"（与 CR-015 同一类问题）。已恢复 baseline 为 **6**，让这次
      退步继续被 `probe_ranking.py` 判为失败，直到有真正解决方案。
      **根因诊断（2026-09-06，独立于 CR-048 的复核）**：gold 块在
      spring-kafka 799 块内的纯关键词（BM25）排名是 **125/184**——它是一段
      简短的配置说明（63 token），FTS OR 查询里的"配置"/"重试"/"队列"这类
      词在语料里普遍出现，短块的词频天然拼不过反复出现这些词的长块，这是它在
      本卡片写之前就已经是 `known_open`（未进 top5）的真正原因，不是本轮
      引入的新缺陷。向量路上它反而是最相关的（`vec#1`），但当前
      `KEYWORD_WEIGHT=VECTOR_WEIGHT=1.0` 的 RRF 融合下，"一路完美、另一路
      缺席"经常打不过"两路都中等"的候选——本卡片新增的两个块恰好两路都有
      中等分数，因此挤占了原本排第 6 的位置。**验证过两个不能解决的方向**：
      (1) 加大 `candidates`（30→60→100→200）不但没有让 gold 回到候选池，
      排名反而变差（7→14→21→12），证明"候选池不够深"不是真正原因；
      (2) 改卡片措辞规避——向量语义相关性是内容本身决定的，压低用词的
      技术准确性去避让一个排序副作用属本末倒置，未采用。**生产实际影响
      核对**：生产证据候选窗口是 `hybrid_search(limit=max_evidence*2=10)`
      而非本探针的 `top_k=5`；gold 排名 6→7 前后均在这个 10 的窗口**内**，
      即真实问答链路在这次改动前后都会把这条证据纳入候选（是否最终入选
      还取决于 0/1 背包证据选择），本次改动**没有观察到对生产证据候选
      集合的实际影响**——这不是免罪声明，只是把"探针 top5 未过"与"生产
      拿不到证据"这两件不一样的事分开记录（同类教训见 development.md
      §5"判据不得耦合语言与表面形态"一节的精神）。**遗留**：这属于
      T-017/CR-041 已调好的 RRF 权重在短配置类块上的结构性弱点，真正修复
      需要专门的排序调优（可能是按块长度归一化关键词分数，或给"两路之一
      排名极佳"额外加权），已登记为独立任务 T-112，不在本轮范围内。
      详见 `development-notes.md` 2026-09-06「处理 CR-048」。

  # ---- CR-041：不提"Spring"也不能系统性排除 Spring Kafka（codex R36 复现的具体案例） ----
  - q: Kafka 消费失败怎么配置重试和死信队列
    project: spring-kafka
    gold: "Retry Config › Configuration › Using the `@RetryableTopic` annotation"
    baseline: 12
    known_open: true
    note: |
      2026-09-06（CR-041）：与上一条金标准探针问的是同一件事，唯一区别是
      **不提"Spring"**——这正是 codex R36 复审独立复现的具体反例："纯 Kafka
      重试/DLQ 问题会过滤为 kafka，排除 Spring Kafka 文档"。死信队列/DLQ
      在 Kafka 生态里不是 broker 协议的原生概念，`detect_technology()` 新增
      "死信"/"dlq"/"dead letter" 三个词直接判定为 `spring-kafka`（见
      `services/retrieval/tokenize.py` PROJECT_TERMS），不要求用户显式说出
      "Spring"。修复前（`technology` 判定为纯 `kafka`，spring-kafka 完全
      被排除在候选之外）：`rank=None`，`hybrid_search(limit=20)` 返回的
      20 条候选 100% 来自 kafka（0 条 spring-kafka）；修复后：第 12 名。
      未进 top5，如实
      记为 known_open——`TECHNOLOGY_GROUPS` 的权重机制保证了"不被系统性
      排除"，但排序质量本身还不够好（这是与上一条探针共享的同一个残留
      gap：spring-kafka 自己 799 块内部对这个问题的排序也没有把
      `@RetryableTopic` 一节排到很前，见上一条探针的 note）。判别性验证：
      `git stash` 换回 CR-041 之前的 `tokenize.py`/`search.py`，重放同一
      查询确认退化为 `technology=kafka`、`rank=None`。
      2026-09-06（T-007 第二张卡片）：与上一条探针同一根因，12 → 14。
      **CR-048 指出同步改 baseline 是错误处理，已恢复为 12**，理由、根因
      诊断（含 candidates 加深反而变差、生产 `limit=10` 窗口前后均排除
      在外因此无实际影响）与后续任务 T-112 均同上一条探针的记录，不重复
      展开。
