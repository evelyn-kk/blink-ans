# 知识来源注册表
#
# 规则（见 development.md 第 4 节、architecture.md 5.1）：
# - 每个来源必须登记项目名、官方仓库、许可、分支或 tag、同步范围。
# - 许可在同步时**从仓库内的许可文件实测校验**，不以本文件的声明为准；
#   声明与实测不符时同步失败，不得入库。
# - ingest: false 的来源只做实时链接检索（I6），正文不进核心语料。
#
# 校验记录：所有 license 与 paths 均于 2026-08-31 经 GitHub API 核实。
# 2026-09-01：五个入库来源全部固定到发布版本，base_url 与 ref 同版本（CR-005）；
#            锚点与链接以 `kb verify-links --check-anchors` 实测核对。

version: 1

sources:
  - id: spring-boot
    project: spring-boot
    technology: spring
    repo: https://github.com/spring-projects/spring-boot
    # 固定发布 tag（CR-005）。main 是未发布的开发版，其章节 id 与官网
    # 当前文档对不上；而"版本准确"是本产品的核心卖点，ref 与 base_url 必须同版本。
    # 官网按 minor 线分目录：/4.1.1/ 会 301 到 /4.1/，因此 base_url 用 minor。
    ref: v4.1.1
    license: Apache-2.0
    license_file: LICENSE.txt
    format: asciidoc
    locale: en
    base_url: https://docs.spring.io/spring-boot/4.1/
    paths:
      - documentation/spring-boot-docs/src/docs/antora/modules
    ingest: true
    sync_frequency: monthly

  - id: kafka
    project: kafka
    technology: kafka
    repo: https://github.com/apache/kafka
    # 固定发布 tag（CR-005）。官网新站按版本分目录，且**不接受无版本路径**：
    # /getting-started/introduction 返回 404，/43/getting-started/introduction 才是 200。
    ref: 4.3.1
    license: Apache-2.0
    license_file: LICENSE
    # 上游已从单页 HTML 迁移到 Hugo Markdown（2026-08-31 核实，112 个 .md 文件）
    format: markdown
    locale: en
    # 2026-09-01 复核：官网**已经切换到新站**（Docsy 主题），I1 记录的"官网尚未切换"
    # 已过时。旧的 /documentation/ 现在只是一个 JS 跳转桩，会把访问者送到
    # /{版本}/getting-started/introduction。新结构与仓库 docs/ 目录一一对应，
    # 因此去掉 url_template，改走通用的 Hugo 布局映射。
    base_url: https://kafka.apache.org/43/
    url_strip_prefix: "docs/"
    paths:
      - docs
    ingest: true
    sync_frequency: monthly

  - id: kubernetes
    project: kubernetes
    technology: kubernetes
    repo: https://github.com/kubernetes/website
    # 固定发布分支（CR-005）。main 随时在改，且 kubernetes.io/docs/ 是滚动的
    # latest；版本化站点 v1-36.docs.kubernetes.io 与 release-1.36 分支同版本。
    # 2026-09-01 复核：v1-36 是当前最新的版本化站点，v1-37 尚不存在。
    ref: release-1.36
    license: CC-BY-4.0
    license_file: LICENSE
    format: markdown
    locale: en
    base_url: https://v1-36.docs.kubernetes.io/docs/
    # 仓库 550MB，首期只取与生产问题最相关的两个子域
    paths:
      - content/en/docs/concepts
      - content/en/docs/tasks
    ingest: true
    sync_frequency: monthly

  - id: postgresql
    project: postgresql
    technology: postgresql
    repo: https://github.com/postgres/postgres
    # 锁定发布分支而非 master：master 是未发布的开发版，
    # 其内容在 /docs/current/ 上不存在，会产生大量 404，
    # 且"版本准确"是本产品的核心卖点，版本与链接必须对齐。
    ref: REL_17_STABLE
    license: PostgreSQL
    license_file: COPYRIGHT
    format: docbook
    locale: en
    base_url: https://www.postgresql.org/docs/17/
    paths:
      - doc/src/sgml
    ingest: true
    sync_frequency: quarterly

  - id: spring-data-redis
    project: spring-data-redis
    technology: redis
    repo: https://github.com/spring-projects/spring-data-redis
    # 固定发布 tag（CR-005）。版本化文档在 docs.spring.io/spring-data/redis/
    # 这个路径下（注意不是 spring-data-redis），/4.0/ 直接 200、/3.3/ 与 /9.9/ 404，
    # 说明版本段是真的在生效；当前版本 /4.1/ 会 302 到无版本地址，
    # 等 4.2 发布后 /4.1/ 会直接提供 4.1 的内容，正是需要的防漂移行为。
    ref: 4.1.1
    license: Apache-2.0
    license_file: LICENSE.txt
    format: asciidoc
    locale: en
    base_url: https://docs.spring.io/spring-data/redis/reference/4.1/
    paths:
      - src/main/antora/modules
    ingest: true
    sync_frequency: monthly

  # ---- 仅实时链接检索，正文不入库 ----

  - id: redis-official
    project: redis
    technology: redis
    repo: https://github.com/redis/docs
    ref: main
    license: CC-BY-NC-SA-4.0
    license_file: LICENSE
    format: markdown
    locale: en
    base_url: https://redis.io/docs/latest/
    paths:
      - content
    ingest: false
    ingest_blocked_reason: >-
      官方文档为 CC-BY-NC-SA-4.0（禁止商用），属 architecture.md 5.1 所指"限制更强"的资料，
      不进核心语料库；Redis 相关问题由 spring-data-redis 覆盖使用侧，
      官方细节走 I6 实时链接检索。
    sync_frequency: never
