# 中文技术术语 → 英文检索词映射
#
# 存在的理由（I1 实测）：首批语料 100% 为英文官方文档，
# 而用户用中文提问。关键词检索这一路因此完全失效——
# 中文 token 永远匹配不上英文正文，bm25 只能靠 "postgresql" 这类
# ASCII 词排序，结果是"谁提得多谁排前面"，纯噪声。
#
# 这里把中文概念展开为英文检索词，让关键词路重新发挥作用。
# 注意这不能替代场景卡片：卡片是中文的、面向具体故障的，
# 既能桥接语言鸿沟又能压缩上下文（见 architecture.md 5.3）。

version: 1

# 2026-09-02（T-017）：补入 20 条。原 74 条对 I2 遗留失败题的
# 14 个中文概念只覆盖 3 个，关键词路等于没上场。

terms:
  # ---- 数据库 ----
  慢查询: [slow query, slow queries, query performance, EXPLAIN]
  执行计划: [execution plan, query plan, EXPLAIN, planner]
  全表扫描: [sequential scan, Seq Scan, full table scan]
  # 2026-09-02（T-025）：原值 [index not used, unused index, index scan] 对不上语料。
  # PG 讲这件事的小节是 Indices › Indexes › Examining Index Usage，
  # 正文用词是 examining/forcing index usage、planner、cost estimate、ANALYZE，
  # 不含 "unused index"。实测该小节在关键词路从第 109 名升到第 1 名。
  索引失效: [index usage, examining index usage, forcing index usage,
           sequential scan, enable_seqscan, planner, cost estimate, EXPLAIN ANALYZE]
  统计信息: [statistics, ANALYZE, pg_statistic]
  连接池: [connection pool, pooling, max_connections]
  事务隔离级别: [transaction isolation level, isolation level]
  脏读: [dirty read]
  幻读: [phantom read]
  不可重复读: [non-repeatable read]
  死锁: [deadlock]
  锁等待: [lock wait, lock contention]
  自增主键: [serial, identity column, sequence]
  分区表: [partitioned table, table partitioning]
  真空: [vacuum, autovacuum]
  膨胀: [bloat, table bloat]

  # ---- 消息与流 ----
  投递语义: [message delivery semantics, delivery semantics, at-least-once, exactly-once]
  幂等生产者: [idempotent producer, idempotent delivery, enable.idempotence, sequence number]
  心跳: [heartbeat, heartbeat.interval.ms]
  会话超时: [session timeout, session.timeout.ms]
  拉取: [poll, fetch, max.poll.records]
  事务: [transaction, transactional]
  生产者: [producer]
  消费者: [consumer]
  主题: [topic]
  提交: [commit, committed]
  重复消费: [duplicate consumption, at-least-once, reprocessing]
  幂等: [idempotent, idempotence, enable.idempotence]
  幂等性: [idempotent, idempotence]
