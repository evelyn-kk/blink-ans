  # ---- 通用故障 ----
  # 这两条是**通用**中文词，展开出的英文也通用。保留它们是因为
  # 「探针失效」这类没有专属映射的提问仍需要一点信号，但要靠两道闸限制伤害（T-025）：
  #   1. 最具体者胜——`索引失效` 命中时 `失效` 自动丢弃（见 tokenize.matched_terms）；
  #   2. `not` / `used` 这类功能词单独出现时被 EXPANSION_STOPWORDS 滤掉，短语保留。
  # `优先级` 去掉了 `order`：它在数据库语料里指 ORDER BY，与「优先级」无关，
  # 而 `配置优先级` 的 `property source order` 是短语，不受影响。
  失效: [not used, ignored, disabled, invalid]
  优先级: [precedence, priority]
  超时: [timeout, timed out]
  重试: [retry, retries, backoff]
  背压: [backpressure]
  最终一致性: [eventual consistency]
  分布式事务: [distributed transaction, two-phase commit, saga]
  对账: [reconciliation]
  压测: [load test, benchmark, stress test]
  发布回滚: [rollback deployment, revert]
