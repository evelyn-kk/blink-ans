<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>blink-ans</title>
<style>
  :root { color-scheme: light dark; --fg:#1a1a1a; --dim:#666; --line:#ddd; --bg:#fff; --card:#f6f6f6; --warn:#8a5a00; --err:#a11; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#e8e8e8; --dim:#999; --line:#333; --bg:#161616; --card:#1f1f1f; --warn:#d4a017; --err:#e66; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:1.5rem 1rem 4rem; background:var(--bg); color:var(--fg);
         font:15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
         max-width:44rem; margin-inline:auto; }
  h1 { font-size:1.05rem; margin:0 0 1rem; font-weight:600; }
  h1 small { color:var(--dim); font-weight:400; margin-left:.5rem; }
  form { display:flex; gap:.5rem; }
  input { flex:1; padding:.6rem .75rem; border:1px solid var(--line); border-radius:6px;
          background:var(--bg); color:var(--fg); font:inherit; }
  button { padding:.6rem 1.1rem; border:0; border-radius:6px; background:#2f6fdb; color:#fff;
           font:inherit; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  #status { color:var(--dim); font-size:.85rem; margin:.9rem 0 0; min-height:1.2em; }
  #status.warn { color:var(--warn); }
  #status.err { color:var(--err); }
  #answer { white-space:pre-wrap; margin-top:.9rem; }
  #answer:empty { display:none; }
  #sources { margin-top:1.4rem; padding:0; list-style:none; }
  #sources li { background:var(--card); border-radius:6px; padding:.6rem .75rem; margin-bottom:.5rem;
                font-size:.85rem; }
  #sources a { color:#2f6fdb; text-decoration:none; word-break:break-all; }
  #sources a:hover { text-decoration:underline; }
  .idx { display:inline-block; min-width:1.5rem; color:var(--dim); }
  #meta { margin-top:1rem; white-space:pre-wrap; color:var(--dim); font-size:.78rem; font-family:ui-monospace,Menlo,monospace; }
</style>

<h1>blink-ans <small>Java / Spring 云原生问答</small></h1>

<form id="f">
  <label for="language">语言</label>
  <select id="language" aria-label="回答与转写语言">
    <option value="zh">中文</option>
    <option value="en">English</option>
  </select>
  <input id="q" placeholder="例如：Kafka 消费者重复消费怎么排查" autocomplete="off" autofocus>
  <button id="go">提问</button>
  <button id="mic" type="button">语音输入</button>
  <button id="cancel" type="button" disabled>取消录音</button>
</form>

<p id="transcript"></p>

<p id="status"></p>
<div id="answer"></div>
<ul id="sources"></ul>
<div id="meta"></div>

<script>
const $ = s => document.querySelector(s);
const statusEl = $('#status'), answerEl = $('#answer'), srcEl = $('#sources'), metaEl = $('#meta');
const transcriptEl = $('#transcript'), micEl = $('#mic'), cancelEl = $('#cancel'), languageEl = $('#language');

// 证据充分性直接影响用户该多信任这个回答，必须显式呈现而不是藏起来。
const SUFFICIENCY = {
  sufficient:   ['', ''],
  limited:      ['warn', '证据相关性一般，回答可能不完整'],
  insufficient: ['warn', '本地知识库未覆盖该问题，以下不是确定结论'],
};

// `recording` 只在语音问答时传入：答案请求带上 transcript_id 让服务端接上转写阶段的打点，
// 本机另按自己的时钟量"停止录音 → 收到首个非空正文"。两台机器的时钟不能互相减。
async function submitAnswer(question, language, recording) {
  question = question.trim();
  if (!question) return;
  const voice = recording ? {recording, firstTextAt: null} : null;

  $('#go').disabled = true;
  answerEl.textContent = ''; srcEl.innerHTML = ''; metaEl.textContent = '';
  statusEl.className = ''; statusEl.textContent = '检索中…';

  try {
    const r = await fetch('/v1/answers', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(recording ? { question, language, transcript_id: recording.id } : { question, language }),
    });
    if (!r.ok) throw new Error(`创建会话失败 (${r.status})`);
    const { stream_url } = await r.json();
    await consume(stream_url, undefined, undefined, voice);
  } catch (err) {
    statusEl.className = 'err';
    statusEl.textContent = err.message;
  } finally {
    $('#go').disabled = false;
  }
}
$('#f').addEventListener('submit', async e => {
  e.preventDefault();
  await submitAnswer($('#q').value, languageEl.value);
});

// T-008：浏览器只上传 16 kHz 单声道 s16le PCM。单个 held chunk 留到下一块/停止时
// 才发送，使最后一块可以带 final=true，服务端无需用重复 PCM 触发最终转写。
// R176：服务端每个 partial 都对累计音频整段重转写，远慢于 callback 节奏；因此同一时刻
// 只允许一个 partial 在途，其间到达的块在 `pending` 里合并成下一个 partial，
// 停止时只等在途那一个，其余未发送的音频全部并入唯一的 final。
let recorder = null;
// 这是待真机校准的起点，而不是跨设备的音量或时延结论。静音以样本时长累计，
// 不以 callback 次数累计，避免不同浏览器的 buffer 大小时长改变 VAD 语义。
const VAD_SPEECH_RMS = 0.015;
const VAD_SILENCE_MS = 1200;
function pcm16(samples, inputRate) {
  const ratio = inputRate / 16000, n = Math.floor(samples.length / ratio), out = new Int16Array(n);
  for (let i = 0; i < n; i++) {
    const x = Math.max(-1, Math.min(1, samples[Math.floor(i * ratio)])); out[i] = x * 32767;
  }
  return out;
}
function pcmBase64(blocks) {
  let binary = '';
  for (const block of blocks) {
    const bytes = new Uint8Array(block.buffer, block.byteOffset, block.byteLength);
    // 合并后的块可达数秒；分段展开，避免一次 fromCharCode(...) 超出参数个数上限。
    for (let i = 0; i < bytes.length; i += 0x8000) binary += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  }
  return btoa(binary);
}
// R177：partial 只在"已有语音块进入 pending 且当前帧不是静音"时发。M4 实测 whisper 对纯静音
// 反而更慢（单块静音 6.4 s、五块静音 3.4 s，加一块语音后 0.85 s），而说话的第一帧还扣在 held 里，
// 所以不能只看"听到过语音"。说完后的静音窗口里启动的 partial 会在 VAD 停止时被 final 取代，
// 却让 final 排在它后面等一次整段转写。静音块不丢：留在 pending，随下一个 partial 或 final 发出。
function speaking(r) {
  return r.speechQueued && r.silenceMs === 0;
}
async function pumpPartials(r) {
  // 停止/取消都会先置 hardwareReleased；停止已把 pending 并入 final，取消则丢弃它们。
  while (r.pending.length && !r.hardwareReleased && speaking(r)) {
    await postChunk(r, pcmBase64(r.pending.splice(0)), false);
  }
}
async function postChunk(recording, pcm_s16le_b64, final) {
  const r = await fetch(`/v1/transcriptions/${recording.id}/chunks`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({pcm_s16le_b64, final})});
  if (!r.ok) throw new Error(`转写失败 (${r.status})`);
  const {stream_url} = await r.json();
  // DELETE cannot recall a request that already reached the server.  The recording
  // object remains the immutable owner of that request, so cancelled recordings
  // must discard every late transcript event instead of updating the next recording.
  if (!recording.cancelled) await consume(stream_url, recording.language, recording);
}
function releaseRecorderHardware(r) {
  if (!r || r.hardwareReleased) return;
  r.hardwareReleased = true;
  if (r.node) { r.node.onaudioprocess = null; r.node.disconnect(); }
  if (r.stream) r.stream.getTracks().forEach(t => t.stop());
  if (r.ctx) r.ctx.close();
}
function resetRecorderUI(error) {
  micEl.textContent = '语音输入'; micEl.disabled = false;
  cancelEl.disabled = true;
  languageEl.disabled = false;
  if (error) { statusEl.className='err'; statusEl.textContent=error.message || String(error); }
}
function cancelRecorder(error, r = recorder) {
  if (recorder === r) recorder = null;
  releaseRecorderHardware(r);
  if (r && r.id) fetch(`/v1/transcriptions/${r.id}`, {method:'DELETE'}).catch(() => {});
  resetRecorderUI(error);
}
async function finishStoppedRecorder(r, inflight, unsent) {
  // A session with no callback has no PCM that can carry final=true.  It must be
  // explicitly cancelled; otherwise the server retains its in-memory session.
  if (!unsent.length) {
    r.cancelled = true;
    fetch(`/v1/transcriptions/${r.id}`, {method:'DELETE'}).catch(() => {});
    resetRecorderUI();
    return;
  }
  try {
    await inflight;
    if (r.uploadError) throw r.uploadError;
    r.finalSentAt = performance.now(); await postChunk(r, pcmBase64(unsent), true);
  }
  catch (e) { cancelRecorder(e, r); return; }
  // A delivered final closes the server session; do not cancel it while it is being drained.
  resetRecorderUI();
}
function stopRecording(r = recorder, reason = 'manual') {
  if (!r || recorder !== r) return;
  // 端到端计时的客户端起点：VAD 判定或用户点击停止的这一刻，早于排空 partial 与上传 final。
  r.stoppedAt = performance.now(); r.stopReason = reason;
  recorder = null; micEl.disabled = true; cancelEl.disabled = true;
  // Freeze upload state, then free privacy-sensitive hardware before waiting on the network.
  const inflight = r.inflight, unsent = r.held ? [...r.pending.splice(0), r.held] : [];
  releaseRecorderHardware(r);
  void finishStoppedRecorder(r, inflight, unsent);
}
function observeVoiceActivity(r, samples, sampleRate) {
  let squares = 0;
  for (let i = 0; i < samples.length; i++) squares += samples[i] * samples[i];
  const rms = samples.length ? Math.sqrt(squares / samples.length) : 0;
  r.heldIsSpeech = rms >= VAD_SPEECH_RMS;
  if (r.heldIsSpeech) {
    r.heardSpeech = true;
    r.silenceMs = 0;
    return;
  }
  // Do not auto-stop a newly opened microphone before the user has spoken.
  if (!r.heardSpeech) return;
  r.silenceMs += samples.length * 1000 / sampleRate;
  if (r.silenceMs >= VAD_SILENCE_MS) stopRecording(r, 'vad');
}
micEl.addEventListener('click', async () => {
  if (recorder) { stopRecording(recorder, 'manual'); return; }
  let stream, ctx, node, id;
  try {
    stream = await navigator.mediaDevices.getUserMedia({audio:{channelCount:1}});
    ctx = new AudioContext(); const source = ctx.createMediaStreamSource(stream);
    node = ctx.createScriptProcessor(8192, 1, 1);
    const language = languageEl.value;
    // 会话语言在请求发出前锁定；不能让创建请求在飞行时被下一次 UI 选择改写语义。
    languageEl.disabled = true;
    const created = await fetch('/v1/transcriptions', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({language})});
    if (!created.ok) throw new Error(`创建转写会话失败 (${created.status})`);
    ({transcript_id:id} = await created.json());
    recorder = {stream, ctx, node, id, language, held:null, pending:[], inflight:null};
    cancelEl.disabled = false;
    node.onaudioprocess = e => {
      const r = recorder;
      if (!r) return;
      const samples = e.inputBuffer.getChannelData(0);
      const next = pcm16(samples, ctx.sampleRate), prior = r.held;
      r.held = next;
      if (prior) { r.pending.push(prior); if (r.heldIsSpeech) r.speechQueued = true; }
      // 先更新 VAD：它可能就在这一帧停止录音（把 pending 并入 final），也决定这一帧是否在说话。
      observeVoiceActivity(r, samples, ctx.sampleRate);
      // 是否正在说话由 pumpPartials 的循环条件统一判断：既管这次要不要发，也管在途 partial 返回时要不要接着发。
      if (recorder === r && r.pending.length && !r.inflight && !r.uploadError) {
        // 失败后不再发后续 partial，留到停止时取消会话（与原串行 queue 被拒后的语义一致）。
        r.inflight = pumpPartials(r).catch(e => { r.uploadError = e; }).finally(() => { r.inflight = null; });
      }
    };
    source.connect(node); node.connect(ctx.destination); micEl.textContent='停止录音'; transcriptEl.textContent='正在转写…';
  } catch (e) {
    // `recorder` 发布后，资源所有权已交给 stopRecorder；不能再按局部变量二次 DELETE。
    if (recorder) { cancelRecorder(e); return; }
    // recorder 尚未发布时也拥有局部资源；不能等 stopRecorder 发现 null 才清理。
    releaseRecorderHardware({node, stream, ctx});
    if (id) fetch(`/v1/transcriptions/${id}`, {method:'DELETE'}).catch(() => {});
    resetRecorderUI(e);
  }
});
cancelEl.addEventListener('click', () => {
  const r = recorder;
  if (!r) return;
  recorder = null; micEl.disabled = true; cancelEl.disabled = true;
  // 取消不排空队列也不发送 final：用户明确丢弃本段语音。
  r.cancelled = true;
  releaseRecorderHardware(r);
  fetch(`/v1/transcriptions/${r.id}`, {method:'DELETE'}).catch(() => {});
  resetRecorderUI();
});

// 用 fetch 流而非 EventSource：EventSource 只支持 GET 且无法设置请求头，
// 后续 I4 的音频分片上传需要 POST，统一走 fetch 便于复用同一套解析。
async function consume(url, transcriptLanguage, recording, voice) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`流不可用 (${res.status})`);
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = '';

  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });

    let i;
    while ((i = buf.indexOf('\n\n')) !== -1) {
      const block = buf.slice(0, i); buf = buf.slice(i + 2);
      const line = block.split('\n').find(l => l.startsWith('data:'));
      if (line) await handle(JSON.parse(line.slice(5)), transcriptLanguage, recording, voice);
    }
  }
}

async function handle(ev, transcriptLanguage, recording, voice) {
  if (recording && recording.cancelled) return;
  switch (ev.type) {
    case 'transcript':
      transcriptEl.textContent = ev.text;
      if (ev.final && ev.text.trim()) {
        $('#q').value = ev.text;
        await submitAnswer(ev.text, transcriptLanguage, recording);
      }
      break;
    case 'retrieval': {
      const [cls, note] = SUFFICIENCY[ev.sufficiency] || ['', ''];
      statusEl.className = cls;
      statusEl.textContent = note || `命中 ${ev.hits} 条证据 · ${ev.elapsed_ms} ms`;
      break;
    }
    case 'status':
      if (!statusEl.className) statusEl.textContent = ev.message;
      break;
    case 'answer_delta':
      if (voice && voice.firstTextAt === null && ev.text.trim()) voice.firstTextAt = performance.now();
      answerEl.textContent += ev.text;
      break;
    case 'sources':
      for (const s of ev.items) {
        const li = document.createElement('li');
        li.innerHTML = `<span class="idx">[${s.index}]</span>${escapeHtml(s.citation)}<br>`;
        const a = document.createElement('a');
        a.href = s.url; a.textContent = s.url; a.target = '_blank'; a.rel = 'noopener';
        li.appendChild(a);
        srcEl.appendChild(li);
      }
      break;
    case 'done':
      metaEl.textContent =
        `首字 ${ev.ttft_s}s · 总计 ${ev.total_s}s · ${ev.decode_tps} tok/s · ` +
        `上下文 ${ev.prompt_tokens} tok（实际 prefill ${ev.prefilled_tokens}） · 模板 ${ev.template_version}` +
        voiceTiming(voice) + serverStages(ev.stages);
      break;
    case 'error':
      statusEl.className = 'err';
      statusEl.textContent = `${ev.stage}: ${ev.message}`;
      break;
  }
}

function voiceTiming(voice) {
  const r = voice && voice.recording;
  if (!r || r.stoppedAt === undefined || voice.firstTextAt === null) return '';
  const label = r.stopReason === 'vad' ? 'VAD 结束' : '停止录音';
  const upload = r.finalSentAt === undefined ? '' : `（其中排空 partial 至发出 final ${Math.round(r.finalSentAt - r.stoppedAt)} ms）`;
  return `\n本机：${label}→首个正文 ${Math.round(voice.firstTextAt - r.stoppedAt)} ms${upload}`;
}
function serverStages(stages) {
  if (!stages || !stages.origin) return '';
  return `\n服务端（自 ${stages.origin}，ms）：` + Object.entries(stages.ms).map(([k, v]) => `${k} ${v}`).join(' · ');
}

const escapeHtml = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
</script>
